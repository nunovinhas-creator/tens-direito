name: Diagnóstico temporário — IGeFE MEGA

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install requests beautifulsoup4 lxml
      - name: Investigar estrutura real do conteúdo
        run: |
          python3 << 'PYEOF'
          import re
          import requests
          from bs4 import BeautifulSoup

          def texto_limpo(el):
              return " ".join(el.get_text(separator=" ").split()) if el else ""

          url = "https://www.igefe.mec.pt/Page/Index/199"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
              "Accept-Language": "pt-PT,pt;q=0.9",
          }
          r = requests.get(url, headers=headers, timeout=20)
          print("status:", r.status_code)
          print("len(r.text):", len(r.text))
          soup = BeautifulSoup(r.text, "lxml")

          # Corpo de texto total da página, sem selectores específicos
          corpo_total = texto_limpo(soup.body)
          print("len(texto corpo inteiro):", len(corpo_total))
          print("\n--- texto completo do <body> (primeiros 3000 chars) ---")
          print(corpo_total[:3000])

          print("\n--- candidatos a container de conteúdo (id/class com 'content'/'conteudo'/'main'/'texto'/'corpo') ---")
          candidatos = soup.select(
              "[id*=content], [class*=content], [id*=conteudo], [class*=conteudo], "
              "[id*=main], [class*=main], main, article, [class*=texto], [class*=corpo], [class*=page]"
          )
          vistos = set()
          for el in candidatos[:20]:
              chave = (el.name, el.get("id"), tuple(el.get("class") or []))
              if chave in vistos:
                  continue
              vistos.add(chave)
              txt = texto_limpo(el)
              print(f"- <{el.name} id={el.get('id')!r} class={el.get('class')!r}> len={len(txt)} :: {txt[:150]}")

          print("\n--- <script> tags que sugerem SPA/render client-side (angular/react/vue/data-*) ---")
          scripts = soup.select("script[src]")
          for s in scripts[:30]:
              src = s.get("src", "")
              if any(k in src.lower() for k in ("angular", "react", "vue", "app.js", "main.js", "bundle")):
                  print("-", src)

          print("\n--- iframes ---")
          for f in soup.select("iframe"):
              print("-", f.get("src"))

          print("\n--- divs com mais texto (top 10 por tamanho) ---")
          divs = soup.select("div")
          divs_com_texto = [(len(texto_limpo(d)), d) for d in divs]
          divs_com_texto.sort(key=lambda x: -x[0])
          for tamanho, d in divs_com_texto[:10]:
              print(f"- len={tamanho} id={d.get('id')!r} class={d.get('class')!r}")
          PYEOF
