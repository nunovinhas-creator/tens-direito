name: Diagnóstico temporário — IGeFE MEGA (localizar match real)

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install requests
      - name: Localizar todas as ocorrências de "de 2026" perto de julho/agosto
        run: |
          python3 << 'PYEOF'
          import re
          import requests

          url = "https://www.igefe.mec.pt/Page/Index/199"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36",
              "Accept-Language": "pt-PT,pt;q=0.9",
          }
          r = requests.get(url, headers=headers, timeout=20)
          html = r.text
          html_lower = html.lower()
          print("status:", r.status_code, "len:", len(html))

          padrao = re.compile(r"(?:\d{1,2}\s+de\s+)?(julho|agosto)\s+de\s+2026", re.IGNORECASE)
          matches = list(padrao.finditer(html))
          print(f"\nTotal de matches do padrão actual: {len(matches)}")
          for m in matches:
              inicio = max(0, m.start() - 150)
              fim = min(len(html), m.end() + 150)
              print("\n--- match em posição", m.start(), "---")
              print(repr(html[inicio:fim]))

          # Também procurar qualquer "2026" e ver o que está por perto, para
          # detectar timestamps de geração de página / cache-busters
          print("\n\n=== todas as ocorrências de '2026' com contexto curto ===")
          for m in re.finditer(r"2026", html):
              inicio = max(0, m.start() - 60)
              fim = min(len(html), m.start() + 60)
              print(repr(html[inicio:fim]))
          PYEOF
