name: Diagnóstico Temporário — Feeds Notícias

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar feedparser
        run: pip install feedparser

      - name: Testar feeds candidatos
        run: python3 scripts/diagnostico_feeds_temp.py
