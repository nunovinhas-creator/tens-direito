name: Shadow Mode Diário

# Trigger preferido: workflow_run, disparado assim que "Pipeline Diário"
# termina (sucesso ou falha — o Shadow lê o checkout directamente, nunca
# depende do pipeline ter tido sucesso). Garante que o Shadow analisa
# sempre o HTML já do dia, nunca antes da corrida das 06:00 UTC.
# Cron `0 8 * * *` fica como rede de segurança para o caso de o
# `workflow_run` nunca chegar a disparar (pipeline desactivado, GitHub
# Actions com incidente); tem guarda anti-duplicado própria (ver step
# "Verificar se já existe relatório de hoje") para nunca gerar dois
# relatórios no mesmo dia.
on:
  workflow_run:
    workflows: ["Pipeline Diário"]
    types: [completed]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Mesmo grupo de concorrência de pipeline-diario.yml — o outro workflow
# que faz `git push` a main. Serializa as duas escritas: nunca correm
# ao mesmo tempo, mesmo que um workflow_dispatch manual coincida com o
# `workflow_run` que já sequencia a maior parte dos casos.
concurrency:
  group: main-writes
  cancel-in-progress: false

jobs:
  shadow-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # ── Guarda anti-duplicado: se o relatório de hoje já existe (ex.:
      # o workflow_run já correu mais cedo hoje), a corrida do cron de
      # segurança sai sem gerar nem commitar nada de novo.
      - name: Verificar se já existe relatório de hoje
        id: verificar_relatorio
        run: |
          HOJE=$(date -u +%Y-%m-%d)
          CAMINHO="shadow_history/shadow_report_${HOJE}.md"
          if [ -f "$CAMINHO" ]; then
            echo "Relatório de hoje (${CAMINHO}) já existe — a sair sem gerar novo nem commitar."
            echo "ja_existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "ja_existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.verificar_relatorio.outputs.ja_existe != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.verificar_relatorio.outputs.ja_existe != 'true'
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "Sem requirements.txt — nada a instalar."
          fi

      # ── Executa o orquestrador já existente — não decide nada aqui,
      # só liga run_shadow_daily.py, que por sua vez liga shadow_mode.py,
      # shadow_mode_analytics.py e shadow_report_md.py (nenhum alterado
      # por este workflow).
      - name: Executar Shadow Mode diário
        if: steps.verificar_relatorio.outputs.ja_existe != 'true'
        run: python scripts/run_shadow_daily.py
        env:
          PYTHONUNBUFFERED: '1'

      # ── Guardrail: o script só pode ter alterado shadow_history/, e
      # nunca apagar histórico existente. Falha em segurança (sem
      # commitar nada) se alguma destas garantias não se verificar.
      - name: Verificar que só shadow_history/ foi alterado
        run: |
          set -e
          ALTERACOES=$(git status --porcelain)
          if [ -z "$ALTERACOES" ]; then
            echo "Sem alterações — nada a verificar."
            exit 0
          fi

          FORA_DE_SHADOW_HISTORY=$(echo "$ALTERACOES" | awk '{print $2}' | grep -v '^shadow_history/' || true)
          if [ -n "$FORA_DE_SHADOW_HISTORY" ]; then
            echo "ERRO CRÍTICO: alterações fora de shadow_history/ detectadas:"
            echo "$FORA_DE_SHADOW_HISTORY"
            exit 1
          fi

          APAGADOS=$(echo "$ALTERACOES" | grep '^ D ' || true)
          if [ -n "$APAGADOS" ]; then
            echo "ERRO CRÍTICO: ficheiros de histórico apagados — recusado."
            echo "$APAGADOS"
            exit 1
          fi

          echo "Guardrail OK — só shadow_history/ foi alterado, nada apagado."

      # ── Commit automático só se houver alterações reais em
      # shadow_history/ — nunca cria um commit vazio.
      - name: Commit e push (só se houver alterações)
        id: commit_push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shadow_history/
          if git diff --staged --quiet; then
            echo "Sem alterações em shadow_history/ — nada para commitar."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(shadow): daily shadow mode report update"
            git pull --rebase --autostash origin main
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Garantir deploy do GitHub Pages ──────────────────────────────────────
      # Mesmo mecanismo de pipeline-diario.yml — ver comentário lá para o
      # raciocínio completo. "pages build and deployment" é dinâmico (sem
      # ficheiro .yml, não editável); este step espera pelo deploy do
      # commit actual e recupera automaticamente via API se falhar com o
      # erro genérico de infra-estrutura já confirmado 3 vezes.
      - name: Garantir deploy do GitHub Pages
        if: steps.commit_push.outputs.pushed == 'true'
        run: bash scripts/garantir_deploy_pages.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Smoke test de produção inline ────────────────────────────────────────
      # Mesmo motivo que em pipeline-diario.yml: um push feito com o
      # GITHUB_TOKEN por omissão nunca dispara smoke-producao.yml (`on:
      # push`) — a proteção anti-recursão do GitHub Actions aplica-se aqui
      # também. O deploy do GitHub Pages redeploy o site inteiro a cada
      # push a main, mesmo quando só shadow_history/*.md mudou — por isso
      # vale a pena confirmar produção aqui também, não só nos pushes do
      # pipeline principal. Reutiliza o mesmo scripts/smoke_producao.sh.
      - name: Smoke test de produção (inline, pós-push)
        if: steps.commit_push.outputs.pushed == 'true'
        run: bash scripts/smoke_producao.sh
