# TEMPORÁRIO — diagnóstico do mecanismo de pesquisa do DRE (Issue #54).
# Apagar este ficheiro e scripts/_diag_dre_pesquisa.py no fim da sessão.
name: Diagnóstico DRE Pesquisa (temporário)

on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install playwright==1.60.0
          python -m playwright install chromium --with-deps

      - name: Correr diagnóstico
        run: python scripts/_diag_dre_pesquisa.py
