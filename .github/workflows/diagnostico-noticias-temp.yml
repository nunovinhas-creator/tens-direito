name: Diagnóstico Notícias (temporário)

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnóstico de feeds de notícias
        run: python scripts/diagnostico_noticias_temp.py
        env:
          PYTHONUNBUFFERED: '1'
