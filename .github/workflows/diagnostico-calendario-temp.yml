# TEMPORÁRIO — verificar se /ptss/pssd/pagamentos é fonte pública real
# do calendário (pista do Nuno). Só lê e imprime. Apagar este ficheiro e
# scripts/_diag_calendario.py assim que o diagnóstico estiver concluído.
name: Diagnóstico Calendário (temporário)

on:
  workflow_dispatch:

permissions: {}

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps
      - name: Testar /ptss/pssd/pagamentos
        run: python scripts/_diag_calendario.py
