name: Verificação de Produção (Smoke Test)

# Corre a cada push a main e também diariamente às 06:30 UTC, como rede
# de segurança — o deploy do Pages já falhou silenciosamente duas vezes
# nesta fase do projecto ("##[error]Deployment failed, try again
# later." em actions/deploy-pages@v5), sem qualquer sinal de erro no
# resto do pipeline: só foi descoberto ao visitar a página e encontrar
# 404. O cron das 06:30 (depois do `pipeline-diario.yml` às 06:00)
# garante que uma falha de deploy nunca fica por detectar até alguém
# reparar manualmente — mesmo padrão de rede de segurança usado em
# `shadow-daily.yml` para o `workflow_run` de "Pipeline Diário".
#
# Gatilho corrigido a 2026-07-05: o `on: workflow_run` original escutava
# "pages build and deployment", mas esse nunca disparou — confirmado
# pelo histórico completo do workflow (3 runs desde a criação, todos
# `workflow_dispatch`, zero `workflow_run`). Causa: "pages build and
# deployment" é um workflow **dinâmico**, gerido internamente pelo
# GitHub Pages (não um workflow definido neste repositório) — o
# `workflow_run` do Actions só encadeia de forma fiável workflows reais
# do repositório, nunca este. Lição generalizável: nunca usar
# `workflow_run` para escutar um workflow gerido pela plataforma
# (Pages, Dependabot, etc.), só workflows com ficheiro `.yml` próprio no
# repositório. Substituído por `push` directo a `main`: dispara sempre,
# de forma garantida, e o deploy real deste site estático completa
# tipicamente em segundos (confirmado: 26s no deploy do commit
# f9030b7) — bem dentro da margem já existente em
# `scripts/smoke_producao.sh` (3 tentativas, 30s entre elas).
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

# actions: write só é necessário para o step "Garantir deploy do
# GitHub Pages" poder disparar um rerun via API quando o deploy falha
# com o erro genérico de infra-estrutura (ver esse step).
permissions:
  actions: write

jobs:
  smoke-test:
    name: Smoke test às páginas críticas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Garantir deploy do GitHub Pages ──────────────────────────────────────
      # Achado de 2026-07-05 (fecho da auditoria): "pages build and
      # deployment" falha esporadicamente com um erro genérico de
      # infra-estrutura ("Deployment failed, try again later.", já
      # confirmado 3 vezes, nunca relacionado com o conteúdo) — até agora
      # só descoberto por um humano a ver a notificação de email e a
      # correr o rerun manualmente. Como esse workflow é dinâmico (sem
      # ficheiro .yml no repositório — não podemos editar-lhe a lógica
      # nem dar-lhe retries internos), este step trata o problema por
      # fora: espera pelo deploy do commit actual (GITHUB_SHA) e, se
      # falhar, dispara-o de novo via API automaticamente — nunca um gate
      # rígido, segue sempre para o smoke test a seguir.
      - name: Garantir deploy do GitHub Pages
        run: bash scripts/garantir_deploy_pages.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar páginas críticas em produção
        run: bash scripts/smoke_producao.sh
