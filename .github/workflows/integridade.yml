name: Integridade do Código

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # semanal segunda 08:00
  workflow_dispatch:

# Em PRs, pushes sucessivos cancelam o run obsoleto anterior (não faz
# sentido gastar minutos a validar um commit já substituído). Em main/
# schedule/dispatch nunca cancela — cada run vai até ao fim.
concurrency:
  group: integridade-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  segredos:
    name: Verificar Segredos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prompt-injection:
    name: Verificar Prompt Injection em Dados Importados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Procurar padrões de injection em data/ e shadow_history/
        run: python scripts/verificar_injecao.py

  python-qualidade:
    name: Qualidade Python (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check scripts/ --select E,F,W --ignore E501
          # E=erros, F=pyflakes, W=warnings
          # E501 ignorado (linhas longas são OK nos scripts)

  python-seguranca:
    name: Vulnerabilidades Packages (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  html-validacao:
    name: Validação HTML (W3C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar validator
        run: |
          pip install html5validator --break-system-packages
      - name: Validar HTML
        run: |
          html5validator --root . \
            --ignore-re ".*noticias\.html.*" \
            --ignore-re ".*404\.html.*" \
            --log WARNING
        continue-on-error: true

  testes-python:
    name: Suite de Testes (pytest)
    runs-on: ubuntu-latest
    # Rede de segurança: sem isto, um hang no job usa o limite por omissão
    # do GitHub Actions (6h). Já aconteceu — ver comentário no passo
    # "Instalar dependências". 30 min dá ~2,7x de folga sobre o pior tempo
    # total real medido nesta sessão (11m14s, suite com ~3600 testes) e
    # espaço para o crescimento orgânico da suite, sem deixar um hang
    # bloquear a fila de pushes a `main` (concurrency, acima) durante horas.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Cache dos browsers do Playwright
        # Cache separado da cache de pip (acima) — evita descarregar de novo o
        # binário do Chromium (~113 MiB) a cada push quando requirements.txt
        # não muda. playwright install detecta o binário já presente e salta
        # o download; --with-deps continua a correr (dependências apt do SO,
        # rápido) mesmo com cache-hit, nunca escondendo uma alteração real de
        # versão do Playwright.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Configurar timeouts do apt (mitiga mirrors instáveis)
        # playwright install --with-deps corre sempre apt-get update/install
        # (dependências de sistema do Chromium — fontes, xfonts, etc.) mesmo
        # com o binário em cache acima; a cache nunca passa por aqui. Sem
        # timeout próprio, uma ligação a um mirror (ex.: azure.archive.
        # ubuntu.com, o mirror regional por omissão nestes runners) pode
        # ficar presa à espera de dados que nunca chegam — confirmado em
        # produção: dois runs em 2026-08-19 ficaram assim pendurados 6h e
        # 4h37m (o segundo só em fila, bloqueado pelo primeiro via
        # concurrency), sem uma única linha de log entre a ligação e o
        # cancelamento por timeout do GitHub. Isto força cada ligação a
        # desistir ao fim de 15s e tentar de novo (até 3x, contra outro
        # mirror se necessário) em vez de esperar indefinidamente.
        run: |
          echo 'Acquire::http::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/99-timeout-ci > /dev/null
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99-timeout-ci > /dev/null
          echo 'Acquire::Retries "3";' | sudo tee -a /etc/apt/apt.conf.d/99-timeout-ci > /dev/null
      - name: Instalar dependências
        # 5 min = ~8,5x o pior tempo real medido nesta sessão (35s, 4 runs
        # saudáveis) — folga para os retries do apt acima a sério, mas nunca
        # mais um hang de horas: falha aqui, nunca aos 6h do limite do job.
        timeout-minutes: 5
        run: |
          pip install -r requirements.txt
          pip install pytest
          playwright install chromium --with-deps
      - name: Correr suite completa
        run: |
          set -o pipefail
          pytest tests/ -q --junitxml=report-testes.xml | tee /tmp/pytest-output.txt
      - name: Guardrail — skips têm de bater certo com a allow-list
        # Substitui o antigo "limiar de testes skipped" (LIMIAR_SKIPPED), que
        # já deixou main vermelha duas vezes (2026-07-05, 2026-07-06) só por
        # ninguém ter incrementado o número quando um skip legítimo novo
        # aparecia — um número mágico dessincroniza-se sempre. Comparação
        # agora é por CONJUNTO exacto (nunca contagem): cada nodeid saltado
        # neste run tem de estar em tests/skips_permitidos.json, e cada
        # entrada dessa allow-list tem de continuar de facto saltada — as
        # duas direcções contam como falha, não só a contagem subir. Ver
        # scripts/verificar_skips_permitidos.py e CLAUDE.md.
        run: python scripts/verificar_skips_permitidos.py report-testes.xml
      - name: Publicar relatório JUnit (para diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-testes
          path: report-testes.xml
          retention-days: 14

  canario-urls-como-pedir:
    name: Canário de URLs Oficiais (Como Pedir)
    # Nunca corre em pull_request: este job valida o mundo exterior
    # (seg-social.pt/gov.pt respondem 200?), não o código do PR. Em PRs
    # com muitos pushes, marteladas repetidas nos portais oficiais são
    # desnecessárias e arriscam flakiness/rate-limit. Mantém-se em push
    # a main + schedule + workflow_dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: pip install requests
      - name: Verificar URLs oficiais citadas nos guias "Como Pedir"
        # Só corre num runner real — o sandbox de desenvolvimento não tem
        # acesso à internet completo (ver CLAUDE.md, "SEG-SOCIAL — ESTRATÉGIA
        # DE FETCH"). Falha vermelho se algum URL de data/urls_como_pedir.json
        # deixar de responder 200 (com retry, nunca por uma falha transitória
        # isolada) — nunca mascarado como sucesso.
        run: python scripts/verificar_urls_como_pedir.py
