name: Integridade do Código

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # semanal segunda 08:00
  workflow_dispatch:

jobs:

  segredos:
    name: Verificar Segredos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prompt-injection:
    name: Verificar Prompt Injection em Dados Importados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Procurar padrões de injection em data/ e shadow_history/
        run: python scripts/verificar_injecao.py

  python-qualidade:
    name: Qualidade Python (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check scripts/ --select E,F,W --ignore E501
          # E=erros, F=pyflakes, W=warnings
          # E501 ignorado (linhas longas são OK nos scripts)

  python-seguranca:
    name: Vulnerabilidades Packages (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  html-validacao:
    name: Validação HTML (W3C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar validator
        run: |
          pip install html5validator --break-system-packages
      - name: Validar HTML
        run: |
          html5validator --root . \
            --ignore-re ".*noticias\.html.*" \
            --ignore-re ".*404\.html.*" \
            --log WARNING
        continue-on-error: true

  testes-python:
    name: Suite de Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Cache dos browsers do Playwright
        # Cache separado da cache de pip (acima) — evita descarregar de novo o
        # binário do Chromium (~113 MiB) a cada push quando requirements.txt
        # não muda. playwright install detecta o binário já presente e salta
        # o download; --with-deps continua a correr (dependências apt do SO,
        # rápido) mesmo com cache-hit, nunca escondendo uma alteração real de
        # versão do Playwright.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pytest
          playwright install chromium --with-deps
      - name: Correr suite completa
        run: |
          set -o pipefail
          pytest tests/ -q | tee /tmp/pytest-output.txt
      - name: Guardrail — limiar de testes skipped
        # Achado real de 2026-07-05: 44 testes Playwright (test_pesquisa_hero.py,
        # test_pesquisa_ranking.py, test_share_js.py, test_simulador_psu_calculo.py)
        # ficaram sempre "skipped" no CI, silenciosamente, desde a criação deste
        # job — o helper _localizar_chromium() só procurava em /opt/pw-browsers
        # (convenção do sandbox do Claude Code), que não existe nos runners do
        # GitHub Actions. Corrigido com fallback para ~/.cache/ms-playwright.
        #
        # Limiar revisto de 6 para 4 em 2026-07-05 (sessão de correcções pós-CSI):
        # o commit do simulador-csi.html tinha subido o total real para 7 sem que
        # o limiar documentado (6) fosse actualizado — a causa não era um binário
        # em falta, mas sim as 3 novas páginas de simuladores (abono/ase/csi)
        # ficarem sem o carimbo "Verificado a" + atribuição exigidos por
        # test_adicionar_autoria_artigos.py, cada uma a contar como um skip
        # legítimo mas não documentado. Corrigido o carimbo nas 3 páginas
        # (em vez de simplesmente subir o limiar) — os 4 skips finais são
        # p/apoios-escolares.html (pillar sem carimbo), 404.html/index.html/
        # simulador-psu.html (fora do índice de pesquisa, deliberado). Subir
        # este número exige decisão consciente, nunca um acidente de ambiente.
        run: |
          LIMIAR_SKIPPED=4
          SKIPPED=$(grep -oE '[0-9]+ skipped' /tmp/pytest-output.txt | grep -oE '[0-9]+' || echo 0)
          echo "Testes skipped: $SKIPPED (limiar: $LIMIAR_SKIPPED)"
          if [ "$SKIPPED" -gt "$LIMIAR_SKIPPED" ]; then
            echo "::error::$SKIPPED testes skipped, acima do limiar documentado de $LIMIAR_SKIPPED. Pode ser uma regressão silenciosa (dependência/binário em falta a impedir testes de correr, ou página nova sem carimbo/atribuição) — investigar antes de subir este limiar."
            exit 1
          fi
