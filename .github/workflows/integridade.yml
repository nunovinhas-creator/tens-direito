name: Integridade do Código

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # semanal segunda 08:00
  workflow_dispatch:

jobs:

  segredos:
    name: Verificar Segredos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prompt-injection:
    name: Verificar Prompt Injection em Dados Importados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Procurar padrões de injection em data/ e shadow_history/
        run: python scripts/verificar_injecao.py

  python-qualidade:
    name: Qualidade Python (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check scripts/ --select E,F,W --ignore E501
          # E=erros, F=pyflakes, W=warnings
          # E501 ignorado (linhas longas são OK nos scripts)

  python-seguranca:
    name: Vulnerabilidades Packages (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  html-validacao:
    name: Validação HTML (W3C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar validator
        run: |
          pip install html5validator --break-system-packages
      - name: Validar HTML
        run: |
          html5validator --root . \
            --ignore-re ".*noticias\.html.*" \
            --ignore-re ".*404\.html.*" \
            --log WARNING
        continue-on-error: true

  testes-python:
    name: Suite de Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Cache dos browsers do Playwright
        # Cache separado da cache de pip (acima) — evita descarregar de novo o
        # binário do Chromium (~113 MiB) a cada push quando requirements.txt
        # não muda. playwright install detecta o binário já presente e salta
        # o download; --with-deps continua a correr (dependências apt do SO,
        # rápido) mesmo com cache-hit, nunca escondendo uma alteração real de
        # versão do Playwright.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pytest
          playwright install chromium --with-deps
      - name: Correr suite completa
        run: |
          set -o pipefail
          pytest tests/ -q --junitxml=report-testes.xml | tee /tmp/pytest-output.txt
      - name: Guardrail — skips têm de bater certo com a allow-list
        # Substitui o antigo "limiar de testes skipped" (LIMIAR_SKIPPED), que
        # já deixou main vermelha duas vezes (2026-07-05, 2026-07-06) só por
        # ninguém ter incrementado o número quando um skip legítimo novo
        # aparecia — um número mágico dessincroniza-se sempre. Comparação
        # agora é por CONJUNTO exacto (nunca contagem): cada nodeid saltado
        # neste run tem de estar em tests/skips_permitidos.json, e cada
        # entrada dessa allow-list tem de continuar de facto saltada — as
        # duas direcções contam como falha, não só a contagem subir. Ver
        # scripts/verificar_skips_permitidos.py e CLAUDE.md.
        run: python scripts/verificar_skips_permitidos.py report-testes.xml
      - name: Publicar relatório JUnit (para diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-testes
          path: report-testes.xml
          retention-days: 14

  canario-urls-como-pedir:
    name: Canário de URLs Oficiais (Como Pedir)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: pip install requests
      - name: Verificar URLs oficiais citadas nos guias "Como Pedir"
        # Só corre num runner real — o sandbox de desenvolvimento não tem
        # acesso à internet completo (ver CLAUDE.md, "SEG-SOCIAL — ESTRATÉGIA
        # DE FETCH"). Falha vermelho se algum URL de data/urls_como_pedir.json
        # deixar de responder 200 (com retry, nunca por uma falha transitória
        # isolada) — nunca mascarado como sucesso.
        run: python scripts/verificar_urls_como_pedir.py
