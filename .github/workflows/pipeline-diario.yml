name: Pipeline Diário

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

# Serializa qualquer escrita concorrente em main: este workflow e
# shadow-daily.yml (o outro que faz `git push`) partilham o mesmo grupo
# — nunca correm ao mesmo tempo, mesmo que um workflow_dispatch manual
# coincida com o cron. cancel-in-progress: false porque um push a meio
# nunca deve ser cancelado — a corrida seguinte espera a sua vez em vez
# de interromper a que já está a escrever.
concurrency:
  group: main-writes
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # ── Espera aleatória antes do scrape: correr exactamente às 06:00 UTC
      # todos os dias é um padrão fácil de bloquear. Só no cron -- disparos
      # manuais (workflow_dispatch) continuam imediatos, para não atrasar
      # testes/depuração.
      - name: Espera aleatória antes do scrape
        if: github.event_name == 'schedule'
        run: |
          ESPERA=$((RANDOM % 1800))
          echo "A aguardar ${ESPERA}s antes do scrape..."
          sleep "$ESPERA"

      # ── Step 1: Scrape fontes ────────────────────────────────────────────────
      - name: Scrape fontes oficiais
        run: python scripts/scraper_playwright.py
        env:
          PYTHONUNBUFFERED: '1'

      # ── Step 1b: Máquina de estados de fontes bloqueadas ─────────────────────
      # Actualiza data/estado_fontes.json a partir de data/bloqueios.json (Camada
      # 1 do scraper, Step 1 acima) — não decide Issues, só calcula
      # {estado, dias_consecutivos_bloqueado, ultima_ok} por fonte monitorizada.
      # Consumido pelo Step 7b/8 abaixo.
      - name: Actualizar estado das fontes
        run: python3 scripts/gerir_estado_fontes.py
        env:
          PYTHONUNBUFFERED: '1'

      # ── Step 2: Detectar mudanças ────────────────────────────────────────────
      - name: Detectar mudanças e registar
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');

            const scraped_dir = 'data/scraped';
            if (!fs.existsSync(scraped_dir)) return;

            const hoje = new Date().toISOString().slice(0, 10);
            const hora = new Date().toISOString().slice(11, 16);

            const fontes = {
              'seg_social_abono': 'https://www.seg-social.pt/abono-de-familia',
              'seg_social_rsi': 'https://www.seg-social.pt/rendimento-social-de-insercao',
              'dge_ase': 'https://www.dge.mec.pt',
              'dge_manuais': 'https://www.dge.mec.pt/manuais-escolares',
              'mega_datas': 'https://www.dge.mec.pt/manuais-escolares',
              'igefe_mega': 'https://www.igefe.mec.pt/Page/Index/199',
              'iefp_desemprego': 'https://www.iefp.pt/subsidio-desemprego',
              'dre_psu': 'https://dre.pt/pesquisa?q=presta%C3%A7%C3%A3o+social+%C3%BAnica',
            };

            const mudancas = [];

            for (const [slug, url] of Object.entries(fontes)) {
              const latest_path = path.join(scraped_dir, `${slug}_latest.json`);

              const files = fs.readdirSync(scraped_dir)
                .filter(f => f.startsWith(slug + '_') && f.includes(hoje) && !f.endsWith('_latest.json'))
                .sort().reverse();

              if (files.length === 0) {
                console.log(`${slug}: sem scrape de hoje`);
                continue;
              }

              const new_path = path.join(scraped_dir, files[0]);
              const new_content = fs.readFileSync(new_path, 'utf8');
              let new_data;
              try { new_data = JSON.parse(new_content); } catch(e) { continue; }

              if (!fs.existsSync(latest_path)) {
                fs.writeFileSync(latest_path, new_content);
                console.log(`${slug}: primeiro scrape guardado como latest`);
                continue;
              }

              const old_content = fs.readFileSync(latest_path, 'utf8');
              let old_data;
              try { old_data = JSON.parse(old_content); } catch(e) {
                fs.writeFileSync(latest_path, new_content);
                continue;
              }

              const hashOf = (d) => {
                const c = {...d};
                ['data_acesso','data_scrape','timestamp','data_run'].forEach(k => delete c[k]);
                return crypto.createHash('sha256').update(JSON.stringify(c, Object.keys(c).sort())).digest('hex');
              };

              // CAMADA 1: ignorar respostas classificadas como bloqueio pelo scraper
              if (new_data.status === 'bloqueado') {
                console.log(`${slug}: BLOQUEADO (Camada 1) — a ignorar comparação de hash`);
                continue;
              }

              const new_hash = new_data.hash_conteudo || hashOf(new_data);
              const old_hash = old_data.hash_conteudo || hashOf(old_data);

              if (new_hash === old_hash) {
                console.log(`${slug}: sem alterações`);
              } else {
                console.log(`${slug}: MUDANÇA DETECTADA`);
                mudancas.push({ slug, url, hoje, hora, new_data, old_data });
                fs.writeFileSync(latest_path, new_content);
              }
            }

            // Guardar lista de mudanças para step de Issues (mais tarde)
            fs.mkdirSync('data', { recursive: true });
            fs.writeFileSync('data/mudancas.json', JSON.stringify(mudancas.map(m => ({
              slug: m.slug, url: m.url, data: m.hoje, hora: m.hora
            })), null, 2));
            console.log(`${mudancas.length} mudança(s) registada(s) em data/mudancas.json`);

      # ── Step 3: Notícias diárias ─────────────────────────────────────────────
      - name: Notícias diárias
        run: python scripts/gerar_noticias.py || echo "gerar_noticias.py falhou ou não existe — a continuar"
        env:
          PYTHONUNBUFFERED: '1'

      # ── Step 3a: Máquina de estados de saúde dos feeds de notícias ──────────
      # Actualiza data/estado_feeds.json a partir de data/feeds_saude_hoje.json
      # (escrito pelo Step 3 acima) — mesmo padrão do Step 1b para fontes
      # bloqueadas. Não decide Issues, só calcula {estado,
      # dias_consecutivos_morto, ultima_ok} por feed. Consumido pelo Step 8.
      - name: Actualizar estado dos feeds de notícias
        run: python3 scripts/gerir_estado_feeds.py
        env:
          PYTHONUNBUFFERED: '1'

      # ── Step 3b: Sanitizar noticias.html ─────────────────────────────────────
      - name: Sanitizar noticias.html
        run: |
          python3 << 'PYEOF'
          import re
          with open('noticias.html', 'r', encoding='utf-8') as f:
              conteudo = f.read()

          # Remover todas as formas de non-breaking space (incluindo dupla codificação)
          conteudo = conteudo.replace('&amp;nbsp;', ' ')
          conteudo = conteudo.replace('&nbsp;&nbsp;', ' ')
          conteudo = conteudo.replace('&nbsp;', ' ')
          conteudo = conteudo.replace('&#160;', ' ')
          conteudo = conteudo.replace('\xa0', ' ')

          # Limpar espaços múltiplos
          conteudo = re.sub(r'  +', ' ', conteudo)

          with open('noticias.html', 'w', encoding='utf-8') as f:
              f.write(conteudo)
          print('✓ noticias.html sanitizado')
          PYEOF

      # ── Step 4: Validar valores estruturados ────────────────────────────────
      - name: Validar valores estruturados
        run: python scripts/extrair_valores.py || echo "extrair_valores.py falhou — a continuar"
        env:
          PYTHONUNBUFFERED: '1'

      # ── Step 4b: Verificar datas sazonais ───────────────────────────────────
      - name: Verificar datas expiradas
        run: python3 scripts/verificar_datas.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Abrir Issues de datas expiradas
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let alertas = [];
            try {
              alertas = JSON.parse(fs.readFileSync('data/alertas_datas.json', 'utf8'));
            } catch(_) {}

            const hoje = new Date().toISOString().slice(0, 10);

            const existing_datas = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-expirada',
            });

            for (const a of alertas) {
              // Evitar duplicados: uma página só pode ter UMA issue "REVER" aberta,
              // independentemente do tipo de padrão que a despoletou (o tipo pode
              // variar de mês para mês — ex.: "Ano letivo" em junho, "Data com mês
              // e ano" em julho — mas é sempre a mesma página por rever).
              const duplicate = existing_datas.data.find(i => i.title.includes(`REVER: ${a.pagina}`));
              if (!duplicate) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: a.titulo,
                  body: a.corpo,
                  labels: ['data-expirada', 'verificar'],
                });
                console.log(`Issue criada: ${a.titulo}`);
              } else {
                console.log(`Issue já existe: ${a.titulo}`);
              }
            }

            // Fecho automático: uma Issue "REVER: <página>" aberta cuja página já
            // não aparece em alertas.json de hoje significa que o padrão que a
            // gerou deixou de existir (página corrigida manualmente, ou a própria
            // deteção da Camada 1 melhorou) — fechar sozinha, nunca ficar órfã.
            const paginas_com_alerta_hoje = new Set(alertas.map(a => a.pagina));
            for (const issue of existing_datas.data) {
              const m = issue.title.match(/REVER: ([^\s—]+)/);
              const pagina = m ? m[1] : null;
              if (pagina && !paginas_com_alerta_hoje.has(pagina)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `✅ \`${pagina}\` já não apresenta o padrão detectado — fechado automaticamente pelo pipeline em ${hoje}.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                console.log(`Issue fechada automaticamente: ${issue.title}`);
              }
            }
            console.log(`${alertas.length} alerta(s) processado(s)`);

      # ── Step 4c: Canário de valores-âncora (IAS e valores legais em metadados) ──
      # Corre todos os dias (não só no cron semanal/push de integridade.yml)
      # — é o mecanismo mais rápido para apanhar um valor legal (IAS, ou um
      # tecto/piso derivado dele) que ficou desactualizado em <title>/meta
      # description depois de uma Portaria nova, tipicamente em janeiro.
      # test_anos_metadados.py junta-se aqui pelo mesmo motivo, mas para anos
      # civis em vez de valores: fica vermelho sozinho em janeiro sem
      # precisar de ninguém "lembrar" de o corrigir (ANO_ATUAL calculado via
      # datetime.now(), nunca uma constante fixa). Só estes ficheiros de
      # testes (rápidos, sem Playwright) — nunca "|| echo ... continuar": se
      # o canário falhar, o job fica vermelho, nunca um sucesso silencioso
      # (invariante CLAUDE.md).
      - name: Canário de valores-âncora (IAS, valores legais e anos em metadados)
        run: |
          pip install pytest
          pytest tests/test_valores_ancora.py tests/test_anos_metadados.py -q

      # ── Step 5: Actualizar README ────────────────────────────────────────────
      - name: Actualizar README
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const hoje = new Date();
            const data_str = hoje.toLocaleDateString('pt-PT', {
              day: '2-digit', month: 'long', year: 'numeric', timeZone: 'Europe/Lisbon'
            });
            const hora_str = hoje.toLocaleTimeString('pt-PT', {
              hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Lisbon'
            });

            const listar = (dir, ext) => {
              try { return fs.readdirSync(dir).filter(f => !ext || f.endsWith(ext)).sort(); }
              catch(_) { return []; }
            };

            const htmls = fs.readdirSync('.').filter(f => f.endsWith('.html') && f !== '404.html').sort();
            const paginas_linhas = htmls.map(f => {
              let titulo = f.replace('.html', '');
              try {
                const m = fs.readFileSync(f, 'utf8').match(/<title>([^<]+)<\/title>/i);
                if (m) titulo = m[1].trim();
              } catch(_) {}
              return `| [\`${f}\`](${f}) | ${titulo} |`;
            });

            const workflows = listar('.github/workflows', '.yml');
            const agents   = listar('.claude/agents', '.md');
            const commands = listar('.claude/commands', '.md');
            const skills   = listar('.claude/skills', '.md');
            const scripts  = listar('scripts', '.py');

            const wf_info = {
              'pipeline-diario.yml': { cron: '`0 6 * * *` (diário 06:00 UTC)', fn: 'Pipeline único: scrape + detectar mudanças + notícias + validar + README + push' },
              'verificar-links.yml': { cron: '`0 7 * * 1` (segunda 07:00 UTC)', fn: 'lychee testa todos os links HTML + Issue se 404' },
              'validar-conteudo.yml': { cron: 'push para main (`**.html`)', fn: 'Valida GA4, OG tags, JSON-LD, disclaimer, data verificação + HTML5 validator' },
            };

            const wf_linhas = workflows.map(f => {
              const info = wf_info[f] || { cron: '—', fn: f.replace('.yml','') };
              return `| \`${f}\` | ${info.cron} | ${info.fn} |`;
            });

            const secao_estado = [
              '## ESTADO ATUAL',
              '',
              `Actualizado automaticamente a partir do repositório em **${data_str}**.`,
              '',
              '### Páginas publicadas',
              '',
              '| Ficheiro | Título |',
              '|---|---|',
              ...paginas_linhas,
            ].join('\n');

            const secao_arq = [
              '## 7. Arquitetura técnica',
              '',
              'Browser-only / mobile, Python, agentes Claude, deploy estático grátis (GitHub Pages).',
              '',
              '```',
              'tens-direito/',
              '├── README.md',
              '├── data/',
              '│   ├── apoios/',
              '│   ├── burocracia/',
              '│   └── scraped/            ← JSONs diários das fontes (gerados automaticamente)',
              '│       └── _fontes_config.json',
              '├── .github/',
              '│   └── workflows/',
              ...workflows.map(f => `│       ├── ${f}`),
              '├── .claude/',
              '│   ├── agents/',
              ...agents.map(f => `│   │   ├── ${f}`),
              '│   ├── commands/',
              ...commands.map(f => `│   │   ├── ${f}`),
              '│   └── skills/',
              ...skills.map(f => `│       ├── ${f}`),
              '├── scripts/',
              ...scripts.map(f => `│   ├── ${f}`),
              '└── *.html                  ← páginas estáticas publicadas',
              '```',
            ].join('\n');

            const secao_actions = [
              '## GitHub Actions',
              '',
              '> Stack 100% gratuito — sem serviços externos.',
              '> Apenas `pipeline-diario.yml` faz `git push`.',
              '',
              '| Workflow | Cron / Trigger | Função |',
              '|---|---|---|',
              ...wf_linhas,
              '',
              '**Labels de Issues automáticas:**',
              '- `fonte-alterada` — conteúdo de uma fonte mudou',
              '- `link-quebrado` — link com 404 confirmado',
              '- `verificar` — revisão pendente',
            ].join('\n');

            const secao_agentes = [
              '## Agentes disponíveis',
              '',
              '**Commands** (`.claude/commands/`) — invocar com `/nome-do-ficheiro`:',
              '',
              ...(commands.length ? commands.map(f => `- [\`/${f.replace('.md','')}\`](.claude/commands/${f})`) : ['- (nenhum)']),
              '',
              '**Skills** (`.claude/skills/`) — usadas internamente pelos commands:',
              '',
              ...(skills.length ? skills.map(f => `- [\`${f.replace('.md','')}\`](.claude/skills/${f})`) : ['- (nenhuma)']),
              '',
              '**Agents** (`.claude/agents/`) — agentes especializados:',
              '',
              ...(agents.length ? agents.map(f => `- [\`${f.replace('.md','')}\`](.claude/agents/${f})`) : ['- (nenhum)']),
            ].join('\n');

            let fontes_linhas = [];
            try {
              const cfg = JSON.parse(fs.readFileSync('data/scraped/_fontes_config.json', 'utf8'));
              for (const [slug, info] of Object.entries(cfg.fontes || {})) {
                const url = info.url_principal || '—';
                const status = info.status_bot ? (info.status_bot.includes('403') ? '⚠️ 403 esperado' : info.status_bot) : '✓';
                const verif = info.verificado_manualmente || '—';
                fontes_linhas.push(`| \`${slug}\` | ${url} | ${status} | ${verif} |`);
              }
            } catch(_) {}

            const secao_fontes_auto = fontes_linhas.length ? [
              '',
              '### Fontes monitorizadas',
              '',
              '| Slug | URL principal | Status (bot) | Verificado |',
              '|---|---|---|---|',
              ...fontes_linhas,
            ].join('\n') : '';

            const rodape = `---\n\n*Atualizado em ${data_str} às ${hora_str} · gerado automaticamente por \`pipeline-diario.yml\`*`;

            const substituir_secao = (texto, marca_inicio, marca_fim, novo_conteudo) => {
              const re = new RegExp(`(<!-- ${marca_inicio} -->)[\\s\\S]*?(<!-- ${marca_fim} -->)`, 'g');
              if (re.test(texto)) {
                return texto.replace(re, `<!-- ${marca_inicio} -->\n\n${novo_conteudo}\n\n<!-- ${marca_fim} -->`);
              }
              return texto + `\n\n<!-- ${marca_inicio} -->\n\n${novo_conteudo}\n\n<!-- ${marca_fim} -->`;
            };

            const substituir_heading = (texto, heading_re, novo_conteudo) => {
              const m = texto.match(heading_re);
              if (!m) return texto;
              const idx_start = texto.indexOf(m[0]);
              const nivel = m[0].match(/^(#+)/)[1];
              const re_next = new RegExp(`\\n${nivel}[^#]`, 'g');
              re_next.lastIndex = idx_start + m[0].length;
              const next = re_next.exec(texto);
              const idx_end = next ? next.index : texto.length;
              return texto.slice(0, idx_start) + novo_conteudo + '\n\n' + texto.slice(idx_end);
            };

            let readme = fs.readFileSync('README.md', 'utf8');
            readme = substituir_secao(readme, 'AUTO:ESTADO', 'END:ESTADO', secao_estado);
            readme = substituir_secao(readme, 'AUTO:ACTIONS', 'END:ACTIONS', secao_actions);
            readme = substituir_secao(readme, 'AUTO:AGENTES', 'END:AGENTES', secao_agentes);
            readme = substituir_secao(readme, 'AUTO:FONTES', 'END:FONTES', secao_fontes_auto);
            readme = substituir_heading(readme, /^## 7\. Arquitetura técnica[^\n]*/m, secao_arq);
            readme = substituir_secao(readme, 'AUTO:RODAPE', 'END:RODAPE', rodape);

            const readme_atual = fs.readFileSync('README.md', 'utf8');
            if (readme !== readme_atual) {
              fs.writeFileSync('README.md', readme);
              console.log('README actualizado.');
            } else {
              console.log('README sem alterações.');
            }

      # ── Step 6: Actualizar data de verificação no index.html ────────────────
      - name: Actualizar data de verificação no index.html
        run: |
          DATE_MES=$(python3 -c "from datetime import datetime,timezone; meses=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro']; now=datetime.now(timezone.utc); print(f'{meses[now.month-1]} {now.year}')")
          DATE_FULL=$(date -u +%Y-%m-%d)
          sed -i "s|id=\"ultima-revisao-mes\">[^<]*<|id=\"ultima-revisao-mes\">${DATE_MES}<|g" index.html
          sed -i "s|\"dateModified\": \"[0-9-]*\"|\"dateModified\": \"${DATE_FULL}\"|g" index.html
          echo "Revisão atualizada: ${DATE_MES} (dateModified: ${DATE_FULL})"

      # ── Step 6a: Destaque sazonal no index.html ──────────────────────────────
      - name: Destaque sazonal
        run: |
          python3 << 'PYEOF'
          import json, re
          from datetime import datetime, timezone

          EVERGREEN = {
              'id': 'evergreen-fallback',
              'titulo': 'Descobre os apoios a que tens direito',
              'texto': 'Guias verificados com fonte oficial e data de actualização. Sem publicidade.',
              'cta_texto': 'Começa aqui →',
              'cta_url': '/comecar-aqui.html',
              'icone': '✅',
          }

          hoje = datetime.now(timezone.utc)
          mes  = hoje.month
          destaque = None
          avisos   = []

          # 1. Evento pontual (ativo == true)
          try:
              with open('data/destaque_evento.json', encoding='utf-8') as f:
                  ev = json.load(f).get('evento') or {}
              if ev.get('ativo') is True:
                  destaque = ev
                  print(f'Destaque: evento [{ev.get("id","?")}]')
              else:
                  print(f'Destaque: evento [{ev.get("id","?")}] inativo — a tentar sazonal')
          except FileNotFoundError:
              avisos.append('AVISO: data/destaque_evento.json não encontrado — a usar sazonal')
          except (json.JSONDecodeError, Exception) as e:
              avisos.append(f'AVISO: destaque_evento.json inválido ({e}) — a usar sazonal')

          # 2. Sazonal por mês
          if not destaque:
              try:
                  with open('data/destaques_sazonais.json', encoding='utf-8') as f:
                      sazonais = json.load(f).get('destaques') or []
                  if not isinstance(sazonais, list):
                      raise ValueError('campo "destaques" não é lista')
                  for s in sazonais:
                      if mes in (s.get('meses') or []):
                          destaque = s
                          print(f'Destaque: sazonal [{s.get("id","?")}] (mês {mes})')
                          break
                  if not destaque:
                      avisos.append(f'AVISO: mês {mes} não coberto em destaques_sazonais.json — a usar evergreen')
              except FileNotFoundError:
                  avisos.append('AVISO: data/destaques_sazonais.json não encontrado — a usar evergreen')
              except (json.JSONDecodeError, ValueError, Exception) as e:
                  avisos.append(f'AVISO: destaques_sazonais.json inválido ({e}) — a usar evergreen')

          # 3. Evergreen (nunca falha — hardcoded)
          if not destaque:
              destaque = EVERGREEN
              print('Destaque: evergreen (fallback de segurança)')

          for av in avisos:
              print(av)

          icone  = destaque.get('icone', '✅')
          titulo = destaque['titulo']
          texto  = destaque['texto']
          cta_t  = destaque['cta_texto']
          cta_u  = destaque['cta_url']

          bloco = (
              f'<span class="destaque-icone">{icone}</span>\n'
              f'    <div class="destaque-body">\n'
              f'      <strong class="destaque-titulo">{titulo}</strong>\n'
              f'      <span class="destaque-texto">{texto}</span>\n'
              f'    </div>\n'
              f'    <a href="{cta_u}" class="destaque-cta">{cta_t}</a>'
          )

          with open('index.html', encoding='utf-8') as f:
              html = f.read()

          padrao_destaque = re.compile(r'<!-- DESTAQUE:INICIO -->[\s\S]*?<!-- DESTAQUE:FIM -->')

          # Verificar a presença dos marcadores em separado da substituição:
          # se o destaque de hoje for igual ao já publicado, re.sub() também
          # produz um texto idêntico ao original — isso não significa que os
          # marcadores estão em falta, só que não há nada para actualizar.
          if not padrao_destaque.search(html):
              print('AVISO: marcadores DESTAQUE:INICIO/FIM não encontrados em index.html — sem injecção')
          else:
              novo = padrao_destaque.sub(
                  (
                      '<!-- DESTAQUE:INICIO -->\n'
                      '  <div id="destaque-sazonal" class="destaque-banda">\n'
                      f'    {bloco}\n'
                      '  </div>\n'
                      '  <!-- DESTAQUE:FIM -->'
                  ),
                  html
              )
              if novo != html:
                  with open('index.html', 'w', encoding='utf-8') as f:
                      f.write(novo)
                  print(f'index.html: destaque injectado [{destaque.get("id","fallback")}]')
              else:
                  print(f'index.html: destaque já actualizado [{destaque.get("id","fallback")}] — sem alterações')
          PYEOF

      # ── Step 6b: Actualizar CLAUDE.md ───────────────────────────────────────
      - name: Actualizar CLAUDE.md
        run: python3 scripts/atualizar_claude_md.py

      # ── Step 6c: Guardrail — verificar ficheiros protegidos ─────────────────
      - name: Verificar ficheiros protegidos
        run: |
          python3 -c "
          import subprocess, sys
          AUTO_GERADOS = ['index.html', 'noticias.html', 'CLAUDE.md', 'README.md']
          result = subprocess.run(
              ['git', 'diff', '--name-only', 'HEAD'],
              capture_output=True, text=True
          )
          modificados = [f.strip() for f in result.stdout.strip().split('\n') if f.strip()]
          violacoes = [f for f in modificados if f.endswith('.html') and f not in AUTO_GERADOS]
          if violacoes:
              print('ERRO CRITICO: ficheiros protegidos modificados pelo pipeline:')
              for f in violacoes:
                  print(f'  - {f}')
              print('Apenas index.html e noticias.html podem ser modificados automaticamente.')
              sys.exit(1)
          print(f'Guardrail OK — {len(modificados)} ficheiro(s) modificado(s), nenhum protegido afectado.')
          "

      # ── Step 7: Push único ───────────────────────────────────────────────────
      - name: Commit e push (único por dia)
        id: commit_push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html noticias.html README.md CLAUDE.md
          if git diff --staged --quiet; then
            echo "Sem alterações para commitar."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "auto: pipeline diário ${DATE}"
            git pull --rebase origin main
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Step 7c2: Garantir deploy do GitHub Pages ────────────────────────────
      # Achado de 2026-07-05 (fecho da auditoria): "pages build and
      # deployment" falha esporadicamente com um erro genérico de
      # infra-estrutura ("Deployment failed, try again later.", já
      # confirmado 3 vezes, nunca relacionado com o conteúdo) — até agora
      # só descoberto por um humano a ver a notificação de email e a
      # correr o rerun manualmente. Como esse workflow é dinâmico (sem
      # ficheiro .yml no repositório — não podemos editar-lhe a lógica
      # nem dar-lhe retries internos), este step trata o problema por
      # fora: espera pelo deploy do commit actual e, se falhar, dispara-o
      # de novo via API automaticamente (scripts/garantir_deploy_pages.sh,
      # nunca um gate rígido — segue sempre para o smoke test a seguir).
      - name: Garantir deploy do GitHub Pages
        if: steps.commit_push.outputs.pushed == 'true'
        run: bash scripts/garantir_deploy_pages.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 7d: Smoke test de produção inline ───────────────────────────────
      # Achado de 2026-07-05: pushes feitos com o GITHUB_TOKEN por omissão
      # (o caso deste workflow) NUNCA disparam outros workflows via `on:
      # push` — é uma proteção anti-recursão nativa do GitHub Actions, sem
      # forma de contornar sem um PAT/App token dedicado. smoke-producao.yml
      # (`on: push`) nunca correu, e nunca vai correr, a seguir a um commit
      # deste pipeline — só o cron de segurança das 06:30 UTC o cobria, com
      # risco de disparar antes do commit do dia (por causa da espera
      # aleatória + tempo de scrape). Corrigido correndo o mesmo script de
      # smoke aqui, no mesmo run que fez o push — causalidade, não timing.
      # Reutiliza scripts/smoke_producao.sh tal como smoke-producao.yml o
      # usa, sem duplicar a lógica de verificação. Só corre se este run
      # publicou de facto um commit novo.
      - name: Smoke test de produção (inline, pós-push)
        if: steps.commit_push.outputs.pushed == 'true'
        run: bash scripts/smoke_producao.sh

      # ── Step 7b: Garantir label fonte-bloqueada ──────────────────────────────
      - name: Criar label fonte-bloqueada se não existir
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: 'fonte-bloqueada',
              });
            } catch(_) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: 'fonte-bloqueada',
                color: 'B60205',
                description: 'Scraper cego: recebeu defesa/login/vazio, não mudança',
              });
              console.log('Label fonte-bloqueada criada.');
            }

      # ── Step 7c: Garantir label feed-morto ───────────────────────────────────
      - name: Criar label feed-morto se não existir
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: 'feed-morto',
              });
            } catch(_) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: 'feed-morto',
                color: '5319E7',
                description: 'Feed de notícias sem itens ou com erro de parsing por 3+ dias seguidos',
              });
              console.log('Label feed-morto criada.');
            }

      # ── Step 8: Abrir Issues se mudanças ou divergências ────────────────────
      - name: Abrir Issues se mudanças detectadas
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const hoje = new Date().toISOString().slice(0, 10);
            const hora = new Date().toISOString().slice(11, 16);

            // Issues de mudanças de fontes
            let mudancas = [];
            try {
              mudancas = JSON.parse(fs.readFileSync('data/mudancas.json', 'utf8'));
            } catch(_) {}

            if (mudancas.length > 0) {
              const existing_mud = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'fonte-alterada',
              });

              for (const m of mudancas) {
                // Dedup por slug, sem a data: uma fonte alterada e ainda não corrigida
                // não deve gerar uma issue nova todos os dias — só um comentário a avisar
                // que a mudança persiste.
                const duplicate = existing_mud.data.find(i => i.title.includes(`Mudança detectada: ${m.slug}`));
                if (!duplicate) {
                  await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: `🔔 Mudança detectada: ${m.slug} (${hoje})`,
                    body: [
                      `## 🔔 Mudança detectada: \`${m.slug}\``,
                      ``,
                      `**Data/hora:** ${hoje} ${hora} UTC`,
                      `**Fonte:** ${m.url}`,
                      ``,
                      `### Acção necessária`,
                      `1. Verificar a fonte manualmente: ${m.url}`,
                      `2. Se os valores/condições mudaram: actualizar a página HTML correspondente`,
                      `3. Actualizar a data de verificação na página`,
                      `4. Fechar esta issue após correcção`,
                    ].join('\n'),
                    labels: ['fonte-alterada', 'verificar'],
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: duplicate.number,
                    body: `🔁 Mudança ainda persiste em \`${m.slug}\` — confirmado novamente em ${hoje} ${hora} UTC.`,
                  });
                }
              }
            }

            // Issues de fontes bloqueadas — máquina de estados (Fase 2)
            // data/estado_fontes.json já foi actualizado pelo Step 1b
            // (scripts/gerir_estado_fontes.py) a partir de data/bloqueios.json de
            // hoje. Só se abre Issue ao 3.º dia consecutivo de bloqueio — dias 1-2
            // ficam só no JSON, sem ruído no GitHub. Fecho automático quando a
            // fonte volta a OK, independentemente de quantos dias esteve bloqueada.
            let estado_fontes = {};
            try {
              estado_fontes = JSON.parse(fs.readFileSync('data/estado_fontes.json', 'utf8'));
            } catch(_) {}

            let bloqueios = [];
            try {
              bloqueios = JSON.parse(fs.readFileSync('data/bloqueios.json', 'utf8'));
            } catch(_) {}
            const bloqueio_por_slug_hoje = {};
            for (const b of bloqueios) {
              if (b.data && b.data.slice(0, 10) === hoje) bloqueio_por_slug_hoje[b.slug] = b;
            }

            const LIMIAR_DIAS_PARA_ISSUE = 3;
            const existing_bl = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'fonte-bloqueada',
            });

            for (const [slug, info] of Object.entries(estado_fontes)) {
              if (info.estado !== 'BLOQUEADO' || info.dias_consecutivos_bloqueado < LIMIAR_DIAS_PARA_ISSUE) continue;
              const b = bloqueio_por_slug_hoje[slug];
              const dup_bl = existing_bl.data.find(i => i.title.includes(`Scraper BLOQUEADO em ${slug}`));
              if (!dup_bl) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `⚠️ Scraper BLOQUEADO em ${slug} (${hoje})`,
                  body: [
                    `## ⚠️ Scraper cego: \`${slug}\``,
                    ``,
                    `**Bloqueado há:** ${info.dias_consecutivos_bloqueado} dia(s) consecutivos`,
                    `**Data/hora:** ${b ? b.data : hoje} UTC`,
                    `**URL:** ${b ? b.url : '—'}`,
                    ``,
                    `### Sinais de bloqueio`,
                    b ? b.motivos.map(m => `- \`${m}\``).join('\n') : '(ver data/estado_fontes.json)',
                    ``,
                    `**Texto útil recebido:** ${b ? b.chars_uteis : '—'} chars`,
                    ``,
                    `### ⚠️ Isto NÃO significa que a fonte mudou`,
                    `O scraper ficou cego a esta fonte durante ${info.dias_consecutivos_bloqueado} dias seguidos. O site mantém o último valor verificado por humano.`,
                    ``,
                    `### Ação necessária`,
                    `1. Confirmar o valor manualmente em ${b ? b.url : '(ver fonte na config do scraper)'}`,
                    `2. Se o valor mudou: actualizar a página HTML e a data de verificação`,
                    `3. Esta issue fecha-se sozinha quando o pipeline voltar a conseguir aceder à fonte`,
                  ].join('\n'),
                  labels: ['fonte-bloqueada', 'verificar'],
                });
                console.log(`Issue fonte-bloqueada criada: ${slug} (${info.dias_consecutivos_bloqueado} dias)`);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: dup_bl.number,
                  body: `🔁 Bloqueio ainda persiste em \`${slug}\` — ${info.dias_consecutivos_bloqueado} dia(s) consecutivos, confirmado em ${hoje}.`,
                });
                console.log(`Issue fonte-bloqueada já existe para ${slug}, comentário adicionado.`);
              }
            }

            // Fecho automático: qualquer Issue "fonte-bloqueada" aberta cujo slug
            // já esteja OK no estado actual.
            for (const issue of existing_bl.data) {
              const m = issue.title.match(/Scraper BLOQUEADO em ([a-z0-9_]+)/);
              const slug = m ? m[1] : null;
              if (slug && estado_fontes[slug] && estado_fontes[slug].estado === 'OK') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `✅ Fonte \`${slug}\` recuperou a ${hoje} — fechado pelo pipeline.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                console.log(`Issue fonte-bloqueada fechada automaticamente: ${slug}`);
              }
            }

            // Issues de feeds de notícias mortos — máquina de estados (Fase 3)
            // data/estado_feeds.json já foi actualizado pelo Step 3a
            // (scripts/gerir_estado_feeds.py) a partir de data/feeds_saude_hoje.json
            // de hoje. Só se abre Issue ao 3.º dia consecutivo sem itens/com erro
            // de parsing — dias 1-2 ficam só no JSON. Fecho automático quando o
            // feed volta a OK.
            let estado_feeds = {};
            try {
              estado_feeds = JSON.parse(fs.readFileSync('data/estado_feeds.json', 'utf8'));
            } catch(_) {}

            let feeds_saude_hoje = [];
            try {
              feeds_saude_hoje = JSON.parse(fs.readFileSync('data/feeds_saude_hoje.json', 'utf8'));
            } catch(_) {}
            const saude_por_nome_hoje = {};
            for (const s of feeds_saude_hoje) {
              if (s.data && s.data.slice(0, 10) === hoje) saude_por_nome_hoje[s.nome] = s;
            }

            const existing_feed = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'feed-morto',
            });

            for (const [nome, info] of Object.entries(estado_feeds)) {
              if (info.estado !== 'MORTO' || info.dias_consecutivos_morto < LIMIAR_DIAS_PARA_ISSUE) continue;
              const s = saude_por_nome_hoje[nome];
              const dup_feed = existing_feed.data.find(i => i.title.includes(`Feed morto: ${nome}`));
              if (!dup_feed) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `📡 Feed morto: ${nome} (${hoje})`,
                  body: [
                    `## 📡 Feed de notícias sem itens: \`${nome}\``,
                    ``,
                    `**Morto há:** ${info.dias_consecutivos_morto} dia(s) consecutivos`,
                    `**URL:** ${s ? s.url : '—'}`,
                    `**Motivo:** ${s ? s.motivo : '(ver data/estado_feeds.json)'}`,
                    ``,
                    `### Ação necessária`,
                    `1. Confirmar manualmente se o feed ainda responde: ${s ? s.url : '(ver scripts/gerar_noticias.py)'}`,
                    `2. Se estiver definitivamente morto, substituir por um equivalente vivo em \`scripts/gerar_noticias.py\` (\`FEEDS\`) — nunca sem confirmar por fetch real primeiro`,
                    `3. Esta issue fecha-se sozinha quando o feed voltar a devolver itens`,
                  ].join('\n'),
                  labels: ['feed-morto', 'verificar'],
                });
                console.log(`Issue feed-morto criada: ${nome} (${info.dias_consecutivos_morto} dias)`);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: dup_feed.number,
                  body: `🔁 Feed \`${nome}\` continua morto — ${info.dias_consecutivos_morto} dia(s) consecutivos, confirmado em ${hoje}.`,
                });
                console.log(`Issue feed-morto já existe para ${nome}, comentário adicionado.`);
              }
            }

            for (const issue of existing_feed.data) {
              const m = issue.title.match(/Feed morto: ([a-z0-9_]+)/);
              const nome = m ? m[1] : null;
              if (nome && estado_feeds[nome] && estado_feeds[nome].estado === 'OK') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `✅ Feed \`${nome}\` recuperou a ${hoje} — fechado pelo pipeline.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                console.log(`Issue feed-morto fechada automaticamente: ${nome}`);
              }
            }

            // Issues de divergências de valores
            let divergencias = [];
            try {
              divergencias = JSON.parse(fs.readFileSync('data/divergencias.json', 'utf8'));
            } catch(_) {}

            if (divergencias.length > 0) {
              const linhas = divergencias.map(d =>
                `**${d.descricao}** (\`${d.campo}\`)\n- Fonte \`${d.slug_fonte}\`: \`${d.valor_fonte}\`\n- HTML \`${d.html_file}\`: \`${d.valor_publicado}\``
              ).join('\n\n');

              // Dedup por título estável (sem data): evita uma issue nova todos
              // os dias enquanto a divergência não for corrigida manualmente.
              const existing_div = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'fonte-alterada',
              });
              const dup_div = existing_div.data.find(i => i.title.includes('divergência(s) de valores'));
              if (!dup_div) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `⚠️ ${divergencias.length} divergência(s) de valores (${hoje})`,
                  body: `Os valores nas fontes oficiais não coincidem com os publicados no site.\n\n${linhas}\n\nActualizar o HTML com o valor correcto e registar nova data de verificação.`,
                  labels: ['fonte-alterada'],
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: dup_div.number,
                  body: `🔁 Divergência(s) ainda presente(s) em ${hoje}:\n\n${linhas}`,
                });
              }
            }

            // Issue específica: datas MEGA 2026/2027 detectadas
            // (dge_manuais/mega_datas OU igefe_mega — ver
            // MEGA_SLUGS_DATAS_RICAS em scraper_playwright.py; ambas
            // registam a mesma chave de aviso, para que qualquer uma
            // dispare esta Issue independentemente de qual detectar
            // primeiro)
            try {
              const avisos_txt = fs.readFileSync('data/scraped/avisos.log', 'utf8');
              if (avisos_txt.includes('mega_2026_2027_publicadas')) {
                const existing = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  labels: 'verificar',
                });
                const duplicate = existing.data.find(i => i.title.includes('MEGA 2026/2027') && i.title.includes('datas'));
                if (!duplicate) {
                  // Extrair excertos do log
                  const match = avisos_txt.match(/mega_2026_2027_publicadas:([^\n]*)/);
                  const excertos = match ? match[1].trim() : '(ver data/scraped/mega_datas_latest.json ou data/scraped/igefe_mega_latest.json)';
                  await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: `📅 MEGA 2026/2027 — datas de emissão detectadas — actualizar manuais-escolares-mega.html`,
                    body: [
                      `## 📅 Datas MEGA 2026/2027 detectadas automaticamente`,
                      ``,
                      `**Data/hora:** ${hoje} ${hora} UTC`,
                      `**Fontes vigiadas:** https://www.dge.mec.pt/manuais-escolares e https://www.igefe.mec.pt/Page/Index/199`,
                      ``,
                      `### Excertos detectados`,
                      `\`\`\``,
                      excertos,
                      `\`\`\``,
                      ``,
                      `### Acção necessária`,
                      `1. Confirmar as datas em https://manuaisescolares.pt`,
                      `2. Actualizar o calendário em \`manuais-escolares-mega.html\` com as datas reais`,
                      `3. Substituir "Final de julho / Início de agosto / Meados de agosto" pelas datas exactas`,
                      `4. Actualizar a data de verificação na página`,
                      `5. Fechar esta issue após actualização`,
                    ].join('\n'),
                    labels: ['verificar', 'fonte-alterada'],
                  });
                }
              }

              // Issue específica: decreto-lei da PSU detectado em DRE
              if (avisos_txt.includes('dre_psu_decreto_detectado')) {
                const existing_psu = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  labels: 'verificar',
                });
                const duplicate_psu = existing_psu.data.find(i => i.title.includes('decreto-lei PSU') && i.title.includes('DRE'));
                if (!duplicate_psu) {
                  const match_psu = avisos_txt.match(/dre_psu_decreto_detectado:([^\n]*)/);
                  const excertos_psu = match_psu ? match_psu[1].trim() : '(ver data/scraped/dre_psu_latest.json)';
                  await github.rest.issues.create({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: `🚨 decreto-lei PSU detectado em DRE — actualizar cluster inteiro`,
                    body: [
                      `## 🚨 Decreto-lei da PSU detectado automaticamente em dre.pt`,
                      ``,
                      `**Data/hora:** ${hoje} ${hora} UTC`,
                      `**Fonte monitorizada:** https://dre.pt/pesquisa?q=presta%C3%A7%C3%A3o+social+%C3%BAnica`,
                      ``,
                      `### Excertos detectados`,
                      `\`\`\``,
                      excertos_psu,
                      `\`\`\``,
                      ``,
                      `### Acções necessárias (por ordem)`,
                      `1. Confirmar publicação em https://dre.pt e anotar número e data do decreto-lei`,
                      `2. Actualizar \`prestacao-social-unica.html\` com valores reais e data de entrada em vigor`,
                      `3. Actualizar \`psu-quando-entra-em-vigor.html\` — substituir "pendente" por factos confirmados`,
                      `4. Actualizar \`psu-quem-tem-direito.html\` — acrescentar valores de referência e procedimento`,
                      `5. Criar \`como-pedir-psu.html\` (gatilho: decreto-lei publicado)`,
