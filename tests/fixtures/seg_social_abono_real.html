  <script>
   function waitForElement(selector, callback, timeout = 5000) {
    const start = Date.now();

    function check() {
     const el = document.querySelector(selector);
     if (el) {
      callback(el);
     } else if (Date.now() - start < timeout) {
      setTimeout(check, 100);
     }
    }
    check();
   }

   document.addEventListener('DOMContentLoaded', () => {
    const backToTop = document.getElementById('backToTop');
    if (!backToTop) return;

    function updateChatbotShift() {
     const chatbotLauncher = document.querySelector(
      '.hi-launcher-container'
     );
     const chatbotWindow = document.querySelector('.hi-webchat-container');
     const shouldShift = !backToTop.classList.contains('ui-helper-hidden');

     if (chatbotLauncher) {
      chatbotLauncher.classList.toggle('shifted-up', shouldShift);
     }
     if (chatbotWindow) {
      chatbotWindow.classList.toggle('shifted-up', shouldShift);
     }
     backToTop.classList.toggle('shifted-up', shouldShift);
    }

    const backToTopObserver = new MutationObserver(updateChatbotShift);
    backToTopObserver.observe(backToTop, {
     attributes: true,
     attributeFilter: ['class'],
    });

    const bodyObserver = new MutationObserver(() => {
     updateChatbotShift();
    });
    bodyObserver.observe(document.body, {
     childList: true,
     subtree: true,
    });

    waitForElement('.hi-launcher-container', updateChatbotShift, 5000);
   });
