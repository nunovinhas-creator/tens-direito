# FATOR DE SUSTENTABILIDADE
# ---------------------------------------------------------------------------
fator_sustentabilidade:
  pensoes_iniciadas_em: 2026
  valor: 0.8237
  estado: verificado
  diploma: "Portaria n.º 476/2025/1"
  dre_url: "POR_PREENCHER"

# ---------------------------------------------------------------------------
# ATUALIZAÇÃO DAS PENSÕES EM 2026
# ---------------------------------------------------------------------------
atualizacao:
  diploma: "Portaria n.º 480-B/2025/1, de 30 de dezembro"
  publicacao: "DR n.º 250/2025, Suplemento, Série I, de 2025-12-30"
  dre_url: "POR_PREENCHER"
  estado: verificado
  revoga: "Portaria n.º 372-B/2024/1, de 31 de dezembro"
  produz_efeitos: "a partir de 2026-01-01"
  aplica_se_a: "pensões atribuídas ANTERIORMENTE a 2026-01-01"
  # Contexto do preâmbulo:
  pib_medio_2_anos_ate_3t2025_pct: 2.12
  ipc_sem_habitacao_dez_2025_pct: 2.27
  # Art. 2.º n.º 1 — limiares em euros (equivalem a 2 e 6 vezes o IAS)
  escaloes:
    - ordem: 1
      limite_inferior_eur: 0
      limite_superior_eur: 1074.26
      equivalencia_ias: "2 x IAS"
      percentagem: 2.80
      aumento_minimo_eur: 9.29
      # Art. 3.º n.º 1: o mínimo de 9,29 € só se aplica a pensões
      # com montante ENTRE 331,79 € e 1074,26 €.
      aumento_minimo_so_acima_de_eur: 331.79
      estado: verificado
    - ordem: 2
      limite_inferior_eur: 1074.26
      limite_superior_eur: 3222.78
      equivalencia_ias: "6 x IAS"
      percentagem: 2.27
      aumento_minimo_eur: 30.08
      aumento_minimo_so_acima_de_eur: null
      estado: verificado
    - ordem: 3
      limite_inferior_eur: 3222.78
      limite_superior_eur: null
      percentagem: 2.02
      aumento_minimo_eur: 73.16
      aumento_minimo_so_acima_de_eur: null
      estado: verificado
  sem_atualizacao_acima_de_eur: 6445.56
  sem_atualizacao_equivalencia_ias: "12 x IAS"
  sem_atualizacao_excecao: "art. 102.º do DL 187/2007 e art. 7.º n.º 2 da Lei 52/2007"
  sem_atualizacao_estado: verificado
  # Parcela das atualizações extraordinárias: 2,80 % (art. 2.º n.º 3)
  parcela_extraordinaria_pct: 2.80

# ---------------------------------------------------------------------------
# PENSÕES MÍNIMAS (art. 44.º n.º 1 — "legislação própria")
# ---------------------------------------------------------------------------
pensoes_minimas:
  diploma: "Portaria n.º 480-B/2025/1, art. 4.º"
  dre_url: "POR_PREENCHER"
  estado: verificado
  escaloes:
    - carreira_min: 0
      carreira_max: 14
      valor_eur: 341.08
      fonte: "art. 4.º n.º 1"
    - carreira_min: 15
      carreira_max: 20
      valor_eur: 357.80
      fonte: "art. 4.º n.º 2"
    - carreira_min: 21
      carreira_max: 30
      valor_eur: 394.82
      fonte: "art. 4.º n.º 2"
    - carreira_min: 31
      carreira_max: null
      valor_eur: 493.52
      fonte: "art. 4.º n.º 2"
  # Invalidez absoluta: mínimo = escalão de 40 anos (DL 187/2007, art. 45.º n.º 1)
  invalidez_absoluta_usa_escalao: "31+"
  # EXCLUSÃO CRÍTICA (art. 4.º n.º 3, alínea b):
  # Os mínimos NÃO se aplicam às pensões antecipadas do regime de
  # flexibilização (art. 20.º n.º 1 al. a) do DL 187/2007), nem às do
  # regime do art. 22.º n.º 2 al. a) do DL 329/93.
  nao_aplicavel_a:
    - "pensões antecipadas do regime de flexibilização (DL 187/2007, art. 20.º n.º 1 a))"
    - "pensões antecipadas do DL 329/93, art. 22.º n.º 2 a)"
  nao_aplicavel_fonte: "Portaria 480-B/2025/1, art. 4.º n.º 3 b)"

