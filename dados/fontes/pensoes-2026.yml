# pensoes-2026.yml
# Parâmetros ANUAIS. Substituído todos os anos.
# Regra: nenhuma chave aqui pode ser inferida — cada valor tem portaria e URL.
#
# CONVENÇÃO DE ESTADO:
#   estado: verificado   -> lido em PDF do DRE, pode ir para produção
#   estado: por_verificar -> o build FALHA se qualquer chave estiver assim
#
# NUNCA USAR COMO FONTE DE CONTEÚDO EDITORIAL DO CLUSTER /p/reformas.html —
# ver brief do cluster: as páginas do cluster citam sempre múltiplos de IAS
# e regras estruturais (pensoes-lei.yml), nunca os euros deste ficheiro.
# Mantido só como arquivo, reutilizável no dia em que houver um simulador
# próprio de reformas.

ano: 2026

meta:
  ultima_revisao_manual: "2026-09-03"
  # Se hoje > vigencia_fim, o build falha (não cai para o ano anterior).
  vigencia_inicio: "2026-01-01"
  vigencia_fim: "2026-12-31"

# ---------------------------------------------------------------------------
# IAS
# ---------------------------------------------------------------------------
ias:
  valor_eur: 537.13
  estado: verificado
  diploma: "Portaria n.º 480-A/2025/1, de 30 de dezembro, art. 2.º"
  publicacao: "DR n.º 250/2025, Suplemento, Série I, de 2025-12-30"
  dre_url: "POR_PREENCHER"
  revoga: "Portaria n.º 6-B/2025/1, de 6 de janeiro"
  produz_efeitos: "a partir de 2026-01-01"
  taxa_atualizacao_ias_pct: 2.80
  # Regra do IAS (Lei 53-B/2006, arts. 4.º e 5.º n.º 3):
  #   IPC sem habitação + 20 % do crescimento real do PIB,
  #   com mínimo de IPC + 0,5 p.p., arredondado à 1.ª decimal.
  #   Em 2026: PIB 2,12 % / IPC 2,27 % -> 2,80 %.
  # Coerência interna com a Portaria 480-B/2025/1:
  #   1074,26 / 2 = 537,13 | 3222,78 / 6 = 537,13 | 6445,56 / 12 = 537,13

# ---------------------------------------------------------------------------
# IDADE NORMAL DE ACESSO
# ---------------------------------------------------------------------------
idade_normal:
  "2026":
    anos: 66
    meses: 9
    estado: verificado
    diploma: "Portaria n.º 358/2024/1, de 30 de dezembro"
    dre_url: "https://diariodarepublica.pt/dr/detalhe/portaria/358-2024-901536090"
  "2027":
    anos: 66
    meses: 11
    estado: verificado
    diploma: "Portaria n.º 476/2025/1"
    dre_url: "POR_PREENCHER"

