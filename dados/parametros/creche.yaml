# Gratuitidade da creche na rede solidária com acordo — Portaria n.º
# 305/2022, de 22 de dezembro de 2022. GRAU 1: texto integral lido em
# fonte primária (ato original) nesta sessão. A Portaria n.º 158/2024/1
# alterou os artigos 2.º, 5.º e 6.º — vale sempre a redação nova nesses
# três; o artigo 4.º (o que a gratuitidade abrange/exclui, incluindo a
# caução) NUNCA foi alterado, é sempre o texto original de 2022.
#
# Despacho n.º 6573/2024 (n.º 5) confirma que a falta de vaga na rede
# de referência é verificada oficiosamente pelo ISS, antes da emissão
# do código de validação — nunca provada pela família. Ver
# creche-gratuita.html e fontes.html para o detalhe completo.
#
# Consolidado em dados/parametros.json por scripts/gerar_parametros_json.py.

creche_caucao_max_eur:
  descricao: "Gratuitidade da creche — valor máximo da caução de reserva de vaga que a creche pode exigir; é sempre devolvida na celebração do contrato de prestação de serviços, nunca uma mensalidade"
  unidade: EUR
  valores:
    - vigencia_inicio: "2022-12-22"
      valor: 25
      referencia_legal: "Portaria n.º 305/2022, de 22 de dezembro de 2022, art. 4.º, n.os 3 e 4 (texto original — não alterado pela Portaria n.º 158/2024/1)"
      fonte_url: "https://diariodarepublica.pt"
      verificado_em: "2026-09-16"

creche_elegivel_nascidos_apos:
  descricao: "Gratuitidade da creche — data de nascimento a partir da qual (inclusive) a criança está abrangida"
  unidade: data
  valores:
    - vigencia_inicio: "2024-01-01"
      valor: "2021-09-01"
      referencia_legal: "Portaria n.º 305/2022, de 22 de dezembro de 2022, art. 5.º, n.º 1, al. a), na redação da Portaria n.º 158/2024/1 (esta alínea foi reescrita — concelho passou a freguesia — mantendo apenas a data já fixada na versão original de 2022) — mesma data reafirmada no art. 2.º, também na redação da Portaria n.º 158/2024/1 (âmbito pessoal)"
      fonte_url: "https://diariodarepublica.pt"
      verificado_em: "2026-09-16"

# Idade máxima (PR 12, 2026-09-28). GRAU 1: texto lido nas consolidações
# oficiais do DRE guardadas em dados/fontes/ (Portaria-198-2022-consolidada-
# 2023-03-10.pdf; Portaria-305-2022-consolidada-2024-06-06.pdf). A Lei n.º
# 2/2022 (dados/fontes/Lei-2-2022.pdf) só faseia a gratuitidade por ano de
# creche (art. 2.º, n.º 1) — não fixa nenhuma idade.
#
# A norma diz "até aos 3 anos" e não fixa o momento do corte (aniversário
# ou fim do ano letivo). Por isso há dois parâmetros:
#   - creche_idade_limite_anos (3): o limite legal. Abaixo dele (anos
#     completos), a condição cumpre-se;
#   - creche_idade_fim_incerteza_anos (4): NÃO é um limite legal, é
#     derivado — nenhuma leitura de "até aos 3 anos" (nem a do fim do ano
#     letivo em que a criança faz 3 anos) chega aos 4 anos completos. Entre
#     os dois, o resultado fica indeterminado, com o motivo escrito na
#     condição; a partir dele, inelegível.

creche_idade_limite_anos:
  descricao: "Gratuitidade da creche — idade (anos completos) até à qual é assegurada a frequência; a norma diz «até aos 3 anos» e não fixa se o corte é no aniversário ou no fim do ano letivo"
  unidade: anos
  valores:
    - vigencia_inicio: "2022-09-01"
      valor: 3
      referencia_legal: "Portaria n.º 198/2022, de 27 de julho, art. 9.º, n.º 4, na redação da Portaria n.º 304/2022, de 22 de dezembro (produz efeitos a partir de 2022-09-01) — «Às crianças é assegurada a continuidade da frequência da creche ou ama, até aos 3 anos.»; aplicável às creches aderentes pelo art. 9.º (aplicação subsidiária) da Portaria n.º 305/2022, de 22 de dezembro"
      fonte_url: "https://diariodarepublica.pt"
      verificado_em: "2026-09-28"

creche_idade_fim_incerteza_anos:
  descricao: "Gratuitidade da creche — idade (anos completos) a partir da qual a criança deixa de estar abrangida em qualquer leitura de «até aos 3 anos»; DERIVADO, não é um limite fixado na lei (ver nota no topo do bloco)"
  unidade: anos
  valores:
    - vigencia_inicio: "2022-09-01"
      valor: 4
      referencia_legal: "Derivado do art. 9.º, n.º 4, da Portaria n.º 198/2022, na redação da Portaria n.º 304/2022 — nenhuma leitura de «até aos 3 anos» (aniversário ou fim do ano letivo) chega aos 4 anos completos; não é um limite legal próprio"
      fonte_url: "https://diariodarepublica.pt"
      verificado_em: "2026-09-28"
