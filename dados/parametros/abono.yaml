# Sessão "Parâmetros YAML + auditoria factual" (2026-07-19) — Commit 2.
#
# Fonte primária: Guia Prático 4001 do ISS, I.P. ("Abono de Família para
# Crianças e Jovens"), v4.80, de 30/06/2026 — PDF oficial lido
# integralmente pelo Nuno (PASSO 0 já cumprido antes desta sessão; os
# valores abaixo não foram re-pesquisados, só migrados para este formato
# e auditados contra abono-de-familia.html). Valores 2026: Portaria n.º
# 60/2026/1, de 5 de fevereiro. Regime: Decreto-Lei n.º 176/2003, na
# redação do Decreto-Lei n.º 56/2022.
#
# ARMADILHA ESTRUTURAL — TRÊS cenários em vigor simultaneamente (o
# escalão de cada família depende de QUAL rendimento/IAS se aplica ao
# seu caso): (a) manutenção/pedidos activos com rendimentos de 2024
# (IAS 2024 = 509,26€); (b) pedidos NOVOS em 2026, rendimentos de 2025
# (IAS 2025 = 522,50€) — cenário simulado por omissão neste site,
# declarado explicitamente na UI; (c) reavaliações em 2026, rendimentos
# de 2026 (IAS 2026 = 537,13€). Os limiares de RR (Rendimento de
# Referência) por escalão mudam consoante o cenário — os VALORES
# mensais por idade (190,98€, etc.) são os mesmos nos três cenários, só
# o escalão a que uma família é atribuída é que pode variar.
#
# CORRECÇÃO REAL ENCONTRADA NA AUDITORIA (2026-07-19): o limite de
# elegibilidade da Garantia para a Infância estava a ser calculado com
# o IAS do ano corrente (0,35 × IAS 2026 × 14 = 2.631,94€) — o Guia
# Prático 4001 fixa este cálculo sempre com o IAS de 2024 (509,26€),
# nunca actualizado para o ano corrente: 0,35 × 509,26 × 14 = 2.495,37€.
# Corrigido aqui e em abono-de-familia.html.
#
# Consolidado em dados/parametros.json por scripts/gerar_parametros_json.py.

