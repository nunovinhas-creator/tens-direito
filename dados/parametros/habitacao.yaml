# --- Tabela geral de IMT 2026 — habitação própria e permanente, CONTINENTE ---
# (Sessão 2, 2026-07-20) Necessária para a coluna "sem isenção" do simulador
# de IMT Jovem. Fonte: art. 17.º, n.º 1, al. a) do CIMT, na redação dada pela
# Lei n.º 73-A/2025 (OE 2026, actualização de +2% dos escalões); tabelas
# práticas da AT no Ofício Circulado n.º 40129/2026, de 6 de janeiro.
# Verificada no PASSO 0 por triangulação (doutorfinancas.pt, eco.sapo.pt,
# apcmc.pt, conselhosdoconsultor.com, imtcalc.pt) E por auto-consistência
# matemática: cada parcela a abater deriva exactamente dos limites
# (abater_n = abater_{n-1} + limite_{n-1} × Δtaxa — ex.: 13.763,35 =
# 10.457,96 + 330.539 × 1%), trancada por teste. Os limites superiores dos
# escalões de 7% e 8% são, POR LEI (art. 9.º-A do CIMT remete para os
# escalões do art. 17.º), os próprios limites do IMT Jovem — reutilizar
# imt_isencao_total_limite_eur / imt_isencao_parcial_limite_eur, nunca
# duplicar aqui. Tabela das REGIÕES AUTÓNOMAS deliberadamente NÃO
# parametrizada: as parcelas a abater RA não foram confirmadas de forma
# conclusiva no PASSO 0 (só os limites do IMT Jovem RA, acima) — o
# simulador cobre só o Continente, com nota visível a apontar para a
# secção RA do guia.

