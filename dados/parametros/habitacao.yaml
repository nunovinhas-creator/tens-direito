# Sessão 1 do plano "Expansão do Cluster Habitação" (2026-07-20), padrão
# OpenFisca de parâmetros com vigência, mesmo princípio de csi.yaml.
#
# PASSO 0 cumprido via WebSearch (WebFetch/curl continuam bloqueados nesta
# sessão para domínios externos — mesma limitação documentada em várias
# sessões anteriores do CLAUDE.md): cada valor abaixo triangulado por
# ≥2 fontes independentes (Doutor Finanças, CNN Portugal, ECO, ABANCA,
# Bankinter, CGD Saldo Positivo, Santander, imojuris.vidaimobiliaria.com)
# antes de qualquer publicação, e cruzado com o texto legal em
# diariodarepublica.pt sempre que citado directamente. Nenhum valor
# divergiu do que o prompt desta sessão indicava.
#
# IMT JOVEM — Lei n.º 30-A/2024, de 20 de junho (autorização legislativa) +
# Decreto-Lei n.º 48-A/2024, de 25 de julho (regime — altera CIMT e CIS) +
# Decreto-Lei n.º 48-D/2024, de 31 de julho (isenção/redução de emolumentos
# de registo). Em vigor desde 1 de agosto de 2024. Os limiares em euros
# (330.539€ / 660.982€) sobem todos os anos com a actualização geral dos
# escalões de IMT — para 2026, essa actualização (+2%) foi feita pela Lei
# n.º 73-A/2025, de 30 de dezembro (Orçamento do Estado para 2026); em 2025
# os mesmos limiares eram 324.058€ / 648.022€.
#
# GARANTIA PÚBLICA — Decreto-Lei n.º 44/2024, de 10 de julho (regime) +
# Portaria n.º 236-A/2024/1, de 27 de setembro (regulamentação, em vigor
# desde 30 de setembro de 2024). O limite de rendimento (8.º escalão de
# IRS) actualiza todos os anos com os escalões de IRS — 86.634€ é o valor
# 2026, confirmado por 2 fontes independentes.
#
# REGIÕES AUTÓNOMAS (Sessão 2, 2026-07-20) — nos Açores e na Madeira os
# limites dos escalões de IMT são elevados em 25% face ao Continente
# (Lei n.º 21/90, de 4 de agosto, artigo único; tabelas práticas da AT no
# Ofício Circulado n.º 40129/2026, de 6 de janeiro), o que eleva também os
# limites do IMT Jovem: isenção total até 413.174€, parcial até 826.228€.
# Nota de arredondamento verificada no PASSO 0: as tabelas práticas da AT
# arredondam ao euro, meio-euro para cima — confirmado pelo 1.º escalão RA
# publicado (132.933€ = 106.346€ × 1,25 = 132.932,50€ → 132.933€), o que
# fixa 826.227,50€ → 826.228€ (uma fonte secundária isolada dizia 826.227€,
# inconsistente com o padrão de arredondamento oficial — descartada).
#
# EXCLUSÃO DE TERRENOS (Sessão 2, 2026-07-20) — a compra de terreno para
# construção da 1.ª habitação está EXCLUÍDA do IMT Jovem, mesmo que a
# construção da moradia já esteja em curso à data da escritura: um terreno
# para construção não é, no momento da compra, um prédio destinado a
# habitação (informação vinculativa da AT, divulgada em outubro de 2025,
# triangulada por ECO/idealista/JN/supercasa no PASSO 0 desta sessão).
#
# Consolidado em dados/parametros.json por scripts/gerar_parametros_json.py.

