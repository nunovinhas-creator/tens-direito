# Parâmetros ESTRUTURAIS das condições de acesso à reforma por velhice —
# padrão OpenFisca de parâmetros com vigência, mesmo princípio de
# csi.yaml/rsi.yaml/desemprego.yaml/habitacao.yaml.
#
# Diploma-base: Decreto-Lei n.º 187/2007, de 10 de maio, na redação
# consolidada verificada directamente no DRE. Fonte fornecida ao
# repositório já pré-verificada (ficheiro de trabalho `pensoes-lei.yml`,
# não commitado): redação confirmada na republicação integral pelo
# Decreto-Lei n.º 16-A/2021 (DR 1.ª série n.º 39, 1.º Suplemento,
# 25-02-2021, págs. 11-(7) a 11-(37)), com a última alteração posterior
# (Decreto-Lei n.º 40/2025, de 26 de março) confirmada a NÃO tocar em
# nenhum dos artigos aqui citados (aditou só o art. 91.º-A, prova de
# vida de residentes no estrangeiro) — verificação directa no DRE feita
# a 2026-09-04, transcrita para este ficheiro nesta sessão (2026-09-07).
#
# Âmbito deliberadamente restrito: só os limiares que o simulador de
# condições de acesso (`simulador-condicoes-reforma.html`) consome —
# nunca a idade normal em vigor nem o factor de sustentabilidade, que
# mudam todos os anos por portaria e não são condição de acesso (ver
# nota do simulador e o "Aviso de âmbito" do próprio brief). São
# limiares absolutos fixados no diploma, nunca revistos por portaria —
# por isso `vigencia_inicio` reflecte a data da redação verificada
# (a republicação de 2021), não uma data de actualização anual.

prazo_garantia_velhice_anos_civis:
  descricao: "Prazo de garantia para acesso à pensão de velhice — anos civis com registo de remunerações"
  unidade: "anos civis"
  valores:
    - vigencia_inicio: "2021-02-25"
      valor: 15
      referencia_legal: "Decreto-Lei n.º 187/2007, de 10 de maio, art. 19.º"
      fonte_url: "https://diariodarepublica.pt/dr/legislacao-consolidada/decreto-lei/2007-34524275"
      fonte_url_complementar: "https://files.diariodarepublica.pt/1s/2021/02/03901/0000200037.pdf"
      verificado_em: "2026-09-04"

