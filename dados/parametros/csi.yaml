      valor: 8040
      referencia_legal: "Decreto-Lei n.º 126-A/2017 — valor de referência CSI 2026, isolado"
      fonte_url: "https://www.seg-social.pt"
      verificado_em: "2026-06-25"

valor_referencia_casal_anual:
