# FASE 2 (sessão de dados abertos, 2026-07-19) — Complemento Solidário
# para Idosos (CSI), padrão OpenFisca de parâmetros com vigência.
#
# PASSO 0 cumprido por migração, não por reverificação de raiz: os 4
# valores abaixo já estavam fact-checked e publicados em
# complemento-solidario-idosos.html (verificado 25/06/2026, com
# `fonte`/`verificado_em` já anexados a cada um em
# simulador-csi.html::PARAMETROS_CSI) — migrados aqui tal e qual, nunca
# recalculados nem inventados. Consolidado em dados/parametros.json por
# scripts/gerar_parametros_json.py.

valor_referencia_individual_anual:
  descricao: "Valor de referência do CSI — pessoa isolada"
  unidade: EUR/ano
  valores:
