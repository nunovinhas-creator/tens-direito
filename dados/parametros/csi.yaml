  valores:
    - vigencia_inicio: "2026-01-01"
      valor: 14070
      referencia_legal: "Decreto-Lei n.º 126-A/2017 — valor de referência CSI 2026, casal/união de facto"
      fonte_url: "https://www.seg-social.pt"
