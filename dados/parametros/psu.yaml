teto_maximo_multiplicador_ias:
  descricao: "PSU — teto máximo do montante mensal global (PSUglobal, já com majorações), em múltiplos do IAS. Renomeado nesta sessão de 'valor_maximo_mensal' (EUR/mês, null) — o decreto-lei fixa-o como multiplicador do IAS, nunca um euro fixo."
  unidade: "× IAS"
