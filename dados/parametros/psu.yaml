# Prestação Social Única — padrão OpenFisca, mesmo princípio de csi.yaml.
#
# A Lei n.º 36/2026, de 27 de julho (autorização legislativa), fixa o
# sentido e a extensão que o decreto-lei do Governo terá de respeitar,
# mas NÃO fixa nenhum valor numérico da fórmula — só o limite de
# património (60×IAS, artigo 2.º, alínea d), subalínea v)). Todos os
# restantes parâmetros ficam `valor: null` até ao decreto-lei (prazo PRR:
# 31 ago 2026). `vigencia_inicio: "2026-06-25"` nos pendentes marca a data
# em que a lei de autorização foi aprovada em votação final global —
# desde essa data estes parâmetros estão formalmente pendentes, por lei,
# não por omissão nossa. Nunca preencher `valor` fora de uma sessão
# dedicada de confirmação (ver .claude/commands/atualizar-cluster-psu.md,
# Passo 4).
#
# CORREÇÃO (2026-07-28, mesma sessão desta migração): o coeficiente da
# Componente de Incentivo ao Trabalho (CIT) tinha, desde 3 jul 2026, um
# "intervalo 0,5–1" atribuído ao "texto aprovado na Assembleia da
# República" — mas o texto real da Lei n.º 36/2026 (artigo 2.º, alíneas
# o) e p)) só confirma que a CIT existe e varia com rendimentos de
# trabalho, sem fixar nenhum número nem intervalo. Esse intervalo nunca
# foi confirmado contra o texto legal primário — removido do YAML e de
# todo o HTML publicado (simulador-psu.html, psu-quando-entra-em-vigor.html,
# psu-quem-tem-direito.html). `coeficiente_cit` fica inteiramente
# pendente, sem min/max.
#
# Consolidado em dados/parametros.json por scripts/gerar_parametros_json.py.

limite_patrimonio_multiplicador_ias:
  descricao: "PSU — limite de património (bens móveis e bens móveis sujeitos a registo), em múltiplos do IAS"
  unidade: "× IAS"
  valores:
    - vigencia_inicio: "2026-06-25"
      valor: 60
      referencia_legal: "Lei n.º 36/2026, de 27 de julho, artigo 2.º, alínea d), subalínea v)"
      fonte_url: "https://dre.pt"
      verificado_em: "2026-07-28"

valor_referencia_mensal:
  descricao: "PSU — Valor de Referência (montante base da fórmula)"
  unidade: "EUR/mês"
  valores:
    - vigencia_inicio: "2026-06-25"
      valor: null
      referencia_legal: "Lei n.º 36/2026, de 27 de julho, artigo 2.º, alínea d), subalínea iv) — fixado por referência ao IAS, sem multiplicador definido; valor exacto reservado ao decreto-lei do Governo, ainda não publicado (prazo PRR: 31 ago 2026)"
      fonte_url: "https://dre.pt"
      verificado_em: "2026-07-28"

valor_maximo_mensal:
  descricao: "PSU — valor máximo da prestação, em acumulação com rendimentos/outras prestações"
  unidade: "EUR/mês"
  valores:
    - vigencia_inicio: "2026-06-25"
      valor: null
      referencia_legal: "Lei n.º 36/2026, de 27 de julho, artigo 2.º, alínea n) — valor a definir por decreto-lei do Governo, ainda não publicado (prazo PRR: 31 ago 2026)"
      fonte_url: "https://dre.pt"
      verificado_em: "2026-07-28"

majoracao_parentalidade_mensal:
  descricao: "PSU — majoração por parentalidade, componente do montante global"
  unidade: "EUR/mês"
  valores:
    - vigencia_inicio: "2026-06-25"
      valor: null
      referencia_legal: "Lei n.º 36/2026, de 27 de julho, artigo 2.º, alínea o) — valor a definir por decreto-lei do Governo, ainda não publicado"
      fonte_url: "https://dre.pt"
      verificado_em: "2026-07-28"

coeficiente_cit:
  descricao: "PSU — coeficiente da Componente de Incentivo ao Trabalho (CIT)"
  unidade: "ratio"
  valores:
    - vigencia_inicio: "2026-06-25"
      valor: null
      referencia_legal: "Lei n.º 36/2026, de 27 de julho, artigo 2.º, alíneas o) e p) — confirma a existência e o mecanismo da CIT, mas não fixa nenhum valor numérico nem intervalo; valor exacto reservado ao decreto-lei do Governo, ainda não publicado"
      fonte_url: "https://dre.pt"
      verificado_em: "2026-07-28"

ponderacao_outro_adulto:
  descricao: "PSU — peso de cada adulto do agregado (18+) além do requerente, no cálculo de adultos equivalentes"
  unidade: "ratio"
  valores:
    - vigencia_inicio: "2026-06-25"
      valor: null
      referencia_legal: "Lei n.º 36/2026, de 27 de julho, artigo 2.º, alínea m) — exige ponderações diferenciadas entre adultos 18+ e crianças/jovens, em regime não globalmente mais desfavorável do que o actual, sem fixar valores; a definir por decreto-lei"
      fonte_url: "https://dre.pt"
      verificado_em: "2026-07-28"

ponderacao_menor_ate_25:
  descricao: "PSU — peso de cada criança/jovem do agregado, no cálculo de adultos equivalentes"
  unidade: "ratio"
  valores:
    - vigencia_inicio: "2026-06-25"
      valor: null
      referencia_legal: "Lei n.º 36/2026, de 27 de julho, artigo 2.º, alínea m) — exige ponderações diferenciadas entre adultos 18+ e crianças/jovens, em regime não globalmente mais desfavorável do que o actual, sem fixar valores; a definir por decreto-lei"
      fonte_url: "https://dre.pt"
