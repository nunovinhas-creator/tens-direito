      valor: 0.50
      referencia_legal: "Decreto-Lei n.º 166/2026, de 13 de agosto, artigo 28.º/2, alínea b) — \"50 % da parte desses rendimentos que exceda o limite previsto na alínea anterior\""
      fonte_url: "https://dre.pt"
      verificado_em: "2026-08-13"

data_producao_efeitos:
  descricao: "PSU — data a partir da qual o decreto-lei produz efeitos (i.e., a partir da qual a PSU substitui de facto as 13 prestações extintas, artigo 57.º). NÃO é um parâmetro de cálculo — é metadata do próprio diploma, guardada aqui para nunca mais ninguém repetir a estimativa pré-decreto de \"1 de janeiro de 2027\" numa página nova. Distinta da entrada em vigor do diploma em si (1.º dia útil seguinte à publicação, 14 de agosto de 2026) — o decreto-lei já é lei desde 14/08/2026, mas só produz efeitos práticos para os beneficiários a partir de 31/12/2026."
