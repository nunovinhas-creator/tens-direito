cit_taxa_acima_limiar:
  descricao: "PSU — Componente de Incentivo ao Trabalho (CIT), parcela 2: taxa aplicada à parte dos rendimentos de trabalho que excede cit_limiar_multiplicador_ias. CIT = min(R, cit_limiar×IAS) + cit_taxa_acima_limiar × max(0, R − cit_limiar×IAS), onde R são os rendimentos de trabalho do titular e do agregado, já deduzidos das contribuições obrigatórias para a segurança social (artigo 28.º/3)."
  unidade: "fracção (0-1)"
  valores:
