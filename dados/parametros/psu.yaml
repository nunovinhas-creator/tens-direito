      referencia_legal: "Decreto-Lei n.º 166/2026, de 13 de agosto, artigo 7.º — \"O valor de referência da PSU corresponde a 50 % do valor do indexante dos apoios sociais (IAS)\""
      fonte_url: "https://dre.pt"
