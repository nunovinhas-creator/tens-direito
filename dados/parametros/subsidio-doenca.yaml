# Sessão "Parâmetros YAML + auditoria factual" (2026-07-19) — Commit 1.
#
# Fonte primária: Guia Prático 5001 do ISS, I.P. ("Subsídio de Doença"),
# v4.55, de 14/07/2026 — PDF oficial lido integralmente pelo Nuno (PASSO 0
# já cumprido antes desta sessão; os valores abaixo não foram
# re-pesquisados, só migrados para este formato e auditados contra as
# páginas publicadas). Regime: Decreto-Lei n.º 28/2004, de 4 de fevereiro,
# na redação atual, + Portaria n.º 337/2004, de 31 de março.
#
# CORRECÇÃO REAL ENCONTRADA NA AUDITORIA (2026-07-19): o piso diário
# mínimo estava a ser calculado sobre o IAS (30% × 537,13 € ÷ 30 = 5,37 €)
# — mas o Guia Prático 5001 fixa-o sobre a Remuneração Mínima Mensal
# Garantida (RMMG), não o IAS: 30% × 920 € ÷ 30 = 9,20 €. Além disso, o
# simulador tinha um SEGUNDO piso (300 €/325 € por mês, convertido em
# 10,00 €/10,8333 €/dia) para quando a RR mensal fosse superior a 500 € —
# esse mecanismo nunca esteve confirmado em fonte primária (as sessões
# anteriores citavam-no como "interpretação conservadora" de uma fonte
# secundária, ⚠️B em CLAUDE.md) e o Guia Prático 5001 não o confirma —
# descreve só UM piso diário unificado (9,20 €), com uma excepção: se a
# RR diária da pessoa for inferior a esse piso, recebe a sua própria RR
# diária (nunca um valor artificialmente superior ao que realmente
# ganha). O piso 300/325 € foi removido — nunca reintroduzir sem uma
# citação de fonte primária nova.
#
# Consolidado em dados/parametros.json por scripts/gerar_parametros_json.py.

