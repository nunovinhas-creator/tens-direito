# Migração parcial de simulador-ase.html → dados/parametros/ (sessão
# 27/09/2026, série "simulador universal", PR 5). Só o limite de RPC do
# escalão B é migrado aqui — é o único valor de que o schema de
# condições precisa (é o limite exterior: acima dele não há direito a
