# fica por migrar — não é âmbito desta série.
#
# Fonte: já citada e verificada no CONFIG inline de simulador-ase.html
# ("Valores fact-checked e publicados em acao-social-escolar.html,
# verificado 24/06/2026") — não é uma nova verificação, é a mesma
# citação, só movida para o formato de parâmetro versionado.

