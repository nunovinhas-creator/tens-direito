# Migração RSI para o padrão OpenFisca (2026-08-24) — RSI era um dos 3
# simuladores por migrar (ver LEVANTAMENTO-DADOS-ABERTOS.md, Fase 0, e
# ROADMAP.md → "Migração do ASE"; RSI/subsídio de desemprego nem sequer
# estavam registados como pendência até este levantamento).
#
# PASSO 0: os 10 valores de PARAMETROS_RSI (era um objecto JS inline em
# simulador-rsi.html) foram verificados um a um contra fonte primária via
# WebSearch — `WebFetch`/`curl` a diariodarepublica.pt, pgdlisboa.pt e
# e-konomista.pt devolveram `EGRESS_BLOCKED` nesta sessão (mesma
# limitação de rede documentada em dezenas de sessões anteriores deste
# repositório — ver CLAUDE.md). Nenhum valor divergiu do que já estava
# publicado em rsi.html/simulador-rsi.html (confirmado antes desta
# migração, com 5 canários novos em tests/test_valores_ancora.py, PR #120)
# — esta migração é só de formato, não de conteúdo.
#
# Diplomas confirmados por triangulação (≥2 pesquisas independentes cada,
# nunca uma só fonte):
# - Valor base (247,56€/mês, titular): Portaria n.º 71/2026/1, de 13 de
#   fevereiro (DR n.º 31/2026, Série I) — fixa o valor de referência anual
#   do RSI, 46,09% do IAS 2026.
# - Percentagens por adulto adicional (70%) e por menor (50%): Lei n.º
#   13/2003, de 21 de maio, artigo 10.º (escala de equivalência), na
#   redação do Decreto-Lei n.º 1/2016, de 6 de janeiro — este DL subiu as
#   percentagens de 50%→70% (adulto) e 30%→50% (menor) face ao regime
#   anterior a 2016; confirmado por 2 pesquisas independentes.
# - Limite de património (60×IAS, mobiliário e bens móveis sujeitos a
#   registo): Decreto-Lei n.º 70/2010, de 16 de junho, artigo 9.º —
#   confirmado por 3 pesquisas independentes, sempre com o mesmo texto
#   quase-verbatim ("não superiores, cada um, a 60 vezes o valor do
#   IAS"); nunca confirmado por leitura directa do artigo (dre.pt
#   bloqueado) — nível de confiança "diploma + artigo triangulados",
#   não "texto primário lido". Distinto do limite de 240×IAS do mesmo
#   diploma, que se aplica ao subsistema de protecção familiar (abono),
#   não ao RSI — não confundir os dois limites deste mesmo DL.
# - Percentagens de rendimentos considerados (80% trabalho dependente,
#   100% independente/subsídio de desemprego/outros): mesmo Decreto-Lei
#   n.º 70/2010 (regras de determinação dos rendimentos na condição de
#   recursos) — diploma confirmado, mas SEM número de artigo específico
#   confirmado com confiança (as pesquisas não isolaram um artigo único
#   para esta regra); nunca inventado um número — citado só o diploma,
#   corroborado pelo Guia Prático 8001 do ISS, I.P.
# - Idade mínima (18 anos): Lei n.º 13/2003, de 21 de maio — condições
#   gerais de atribuição (há excepções legais para menores, não
#   modeladas pelo simulador, já documentadas em rsi.html).
#
# Consolidado em dados/parametros.json por scripts/gerar_parametros_json.py.

