# de cada célula vêm daqui. GARANTIA: confirmado nesta sessão que as 12
# células batem exactamente, sem nenhuma divergência, com a tabela já
# publicada em subsidio-desemprego.html — essa é a garantia principal
# (consistência interna), não uma nova leitura do artigo completo.

