garantia_dias_geral:
  descricao: "Prazo de garantia (dias de registo de remunerações) — regime geral e trabalhador independente economicamente dependente"
  unidade: dias
  valores:
    - vigencia_inicio: "2026-01-01"
      valor: 360
      referencia_legal: "Decreto-Lei n.º 220/2006, artigo 22.º — \"360 dias de trabalho por conta de outrem... num período de 24 meses imediatamente anterior à data do desemprego\""
      fonte_url: "https://diariodarepublica.pt/dr/detalhe/decreto-lei/220-2006-546202"
      verificado_em: "2026-08-24"

garantia_dias_ti_cessacao:
  descricao: "Prazo de garantia (dias) — trabalhador independente, modalidade de cessação de actividade (\"actividade empresarial encerrada\")"
  unidade: dias
  valores:
    - vigencia_inicio: "2026-01-01"
      valor: 720
      # DIPLOMA POR CONFIRMAR — nunca escrever aqui um diploma como se
      # estivesse confirmado. A citação anterior no código
      # (Decreto-Lei n.º 220/2006) é contradita pela pesquisa desta
      # sessão: o regime de trabalhadores independentes com cessação
      # de actividade parece reger-se por um diploma diferente
      # (candidato: Decreto-Lei n.º 65/2012, de 15 de março), mas as
      # fontes secundárias usam terminologia inconsistente ("Subsídio
      # Parcial" vs. "Subsídio Integral" vs. modalidade "cessação de
      # actividade") — não permitiu fixar isto com confiança
      # suficiente para citar como referência autoritativa. O valor em
      # si (720 dias / 48 meses) bate com o texto já publicado em
      # subsidio-desemprego.html ("Actividade empresarial encerrada:
      # prazo de garantia de 720 dias nos 48 meses anteriores, com
      # contribuições à taxa de 25,2%"), distinto do prazo de 360 dias
      # do trabalhador independente "economicamente dependente" (esse
      # sim confirmado, ver garantia_dias_geral). Revisitar numa sessão
      # dedicada, idealmente com acesso directo ao texto legal (dre.pt
      # bloqueado nesta sessão).
      referencia_legal: "Diploma exacto por confirmar — ver nota completa no comentário deste parâmetro em dados/parametros/desemprego.yaml. Valor (720 dias/48 meses) confirmado contra o texto já publicado em subsidio-desemprego.html, nunca contra leitura directa do diploma"
      fonte_url: "https://dre.pt"
      verificado_em: "2026-08-24"

prazo_requerimento_dias:
  descricao: "Prazo (dias seguidos) para apresentar o requerimento a contar da data do desemprego — atrasos reduzem o período de concessão, nunca eliminam o direito"
