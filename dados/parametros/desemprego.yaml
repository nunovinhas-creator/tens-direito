# Migração do simulador de subsídio de desemprego para o padrão
# OpenFisca (2026-08-24) — último simulador por migrar sem bloqueio
# externo (o ASE fica à espera do despacho da DGEstE, ver ROADMAP.md).
#
# PASSO 0 apresentado e aprovado antes desta migração: 16 valores
# escalares (a Fase 0 tinha contado "17" por engano — corrigido em
# LEVANTAMENTO-DADOS-ABERTOS.md) + 12 células da tabela de duração.
# `WebFetch`/`curl` a diariodarepublica.pt/pgdlisboa.pt/app.parlamento.pt
# continuam bloqueados nesta sessão (mesma limitação de sempre) — TODA
# a verificação foi feita por triangulação `WebSearch`, nunca por
# leitura directa do diploma. Nenhum valor caiu fora do formato já
# publicado — migração só de formato, nunca de conteúdo (confirmado
# célula a célula contra subsidio-desemprego.html, ver os comentários
# da tabela de duração mais abaixo).
#
# Diploma-base: Decreto-Lei n.º 220/2006, de 3 de novembro (regime
# jurídico de protecção social no desemprego), na redação actual.
#
# Confiança por grupo:
# - art. 28.º (percentagemRR/divisorRR/diasPorMes/minimo/maximo):
#   citação quase-verbatim de fonte secundária de conteúdo legal,
#   triangulada 2×.
# - art. 22.º (garantiaDiasGeral): citação quase-verbatim, triangulada.
# - art. 37.º (acréscimos + tabela de duração): conceito e mecanismo
#   confirmados por várias fontes independentes; a tabela completa não
#   foi lida de um único texto primário — a garantia adicional é a
#   consistência célula-a-célula com subsidio-desemprego.html
#   (confirmada nesta sessão, zero divergências) e a triangulação já
#   feita numa sessão anterior (13/07/2026).
# - minimoMajorado/prazoRequerimentoDias: diploma confirmado (DL
#   220/2006, o primeiro na redação do DL n.º 64/2012, de 15 de março),
#   mecanismo/percentagem/prazo confirmados, mas SEM número de artigo
#   específico fixado com confiança nesta sessão — nunca inventado.
# - garantiaDiasTiCessacao: ver o comentário dedicado junto ao próprio
#   parâmetro — é o único valor sem diploma atribuído.
#
# Consolidado em dados/parametros.json por scripts/gerar_parametros_json.py.
#
# CORRECÇÃO (2026-09-04, revista 2026-09-05) — "maximo_majorado"
# (1.342,83 € + 10% = 1.477,11 €) REMOVIDO. Fonte primária lida em PDF
# do Diário da República nesta sessão (WebFetch a diariodarepublica.pt/
# files.dre.pt continua bloqueado nesta sessão — o Nuno leu e colou o
# texto): Decreto-Lei n.º 119/2021, de 16 de dezembro
# (https://files.dre.pt/1s/2021/12/24200/0003100034.pdf). O art. 2.º
# altera SÓ o n.º 5 do art. 29.º do DL 220/2006 (o mínimo majorado,
# 1,15× IAS — mantido como minimo_majorado abaixo). O art. 3.º adita o
# art. 28.º-A ao DL 220/2006: majora em 10% "o montante diário do
# subsídio de desemprego, calculado nos termos do artigo anterior"
# (art. 28.º, ANTES dos limites de mínimo/máximo do art. 29.º) — nunca
# altera o tecto de 2,5× IAS do art. 29.º. Formulação precisa (revista
# 2026-09-05, nunca "nunca existiu": não foi verificado nesta sessão o
# histórico completo de regimes transitórios/excepcionais do subsídio
# de desemprego, ex. medidas COVID de 2020-2021, que podem ter tido
# tectos próprios de vigência limitada e já caducada): não existe, na
# redação ACTUAL do art. 28.º-A do DL 220/2006, aditado pelo DL n.º
# 119/2021, nenhum "máximo majorado" — a majoração incide sobre o
# montante diário do art. 28.º, não sobre os limites do art. 29.º, que
# se aplicam sempre ao valor final, depois de qualquer majoração de
# 10% já aplicada ao montante diário.
# Ver majoracao_conjuges_percentagem abaixo para o parâmetro correcto
# (o valor da majoração em si, 10%, não um tecto novo) e
# majoracao-subsidio-desemprego.html para o guia completo do mecanismo
# (condições do art. 28.º-A n.os 1-8, extensão a trabalhadores
# independentes nos arts. 4.º/5.º deste diploma, produção de efeitos
# desde 1 de janeiro de 2022 pelo art. 6.º).

