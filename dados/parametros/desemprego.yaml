      referencia_legal: "Decreto-Lei n.º 220/2006, artigo 28.º-A (aditado pelo artigo 3.º do Decreto-Lei n.º 119/2021, de 16 de dezembro), n.os 1 a 4 — lido directamente em PDF do DR nesta sessão (04/09/2026); produção de efeitos desde 1 de janeiro de 2022 (artigo 6.º do DL 119/2021)"
