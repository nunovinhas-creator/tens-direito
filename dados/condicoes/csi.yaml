# Condições de acesso ao CSI (Complemento Solidário para Idosos) — piloto
# da série "simulador universal" (PR 2, depende do PR 1: perguntas.yaml).
#
# Convenção (mesmo espírito PASSO 0 dos parâmetros): uma condição nunca
# guarda o valor do limiar aqui — referencia sempre `parametro:` em
# dados/parametros/<prestacao>.yaml, resolvido por
# scripts/gerar_condicoes_json.py contra dados/parametros.json já gerado.
# Só quando o limiar ainda não está parametrizado (ver nota na 3.ª condição
# abaixo) é que se aceita `valor_literal:`, e só citando a página onde esse
# valor já está publicado — nunca um número inventado nesta sessão.
#
# operador: all  → todas as condições têm de ser verdadeiras (a maioria dos
#                  apoios). any → basta uma (ex.: cartão de estacionamento,
#                  ainda por fazer).

apoio: csi
pagina: complemento-solidario-idosos.html
operador: all

condicoes:
  - id: idade_minima
    tipo: limiar
    campo: data_nascimento          # o motor deriva idade_meses_totais
    operador_comparacao: gte
    parametro: csi.idade_minima_meses_totais
    unidade_comparacao: meses_totais

  - id: reside_legalmente
    tipo: categorica
    campo: reside_legalmente_pt
    operador_comparacao: eq
    valor_literal: sim

  - id: anos_residencia_minima
    tipo: limiar
    campo: anos_residencia_pt
    operador_comparacao: gte
    valor_literal: 6
    fonte_pagina: complemento-solidario-idosos.html
    nota: >
      Valor publicado na página ("Residência em Portugal: mínimo 6 anos
      ininterruptos"), mas ainda NÃO existe como parâmetro versionado em
      dados/parametros/csi.yaml — não tem vigencia_inicio/referencia_legal/
      fonte_url próprios. Dívida técnica assumida conscientemente para não
      bloquear o PR 2 com uma investigação de fonte primária que é
      trabalho à parte. Não promover a `parametro:` sem passar primeiro
      por PASSO 0 em dados/parametros/csi.yaml.

