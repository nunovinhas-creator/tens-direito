# Banco de perguntas do simulador universal (PR 1 da série "condições de
# acesso"). Cada campo aqui é perguntado UMA VEZ e reutilizado por todos os
# apoios em dados/condicoes/<apoio>.yaml que o referenciarem — é isto que
# evita pedir "idade" outra vez a cada apoio, e evita pedir rendimento em
# euros quando uma condição categórica já chega para excluir ou incluir.
#
# Convenção: campos de data/número são canónicos (ex.: data_nascimento, não
# idade_anos) — é o motor (scripts/gerar_condicoes_json.py + JS de avaliação)
# que deriva idade_anos/idade_meses_totais a partir de data_nascimento,
# nunca o utilizador a fazer essa conta. Isto evita duas perguntas
# diferentes (CSI pede meses totais, IMT Jovem pede anos) para o mesmo facto.
#
# Correcção de 27/09/2026 (revisão do PR 4): "data_nascimento" tinha uma
# única descrição ("pessoa requerente"), mas o requerente nem sempre é a
# pessoa cuja idade decide o direito — no abono de família é a criança/
# jovem, não quem faz o pedido. Um único campo genérico colidiria quando
# o simulador avaliar os dois apoios na mesma sessão (o CSI precisa da
# idade do idoso, o abono da idade da criança, ao mesmo tempo). Por isso
# passa a haver um campo por papel: data_nascimento_requerente (quem faz
# o pedido, é também o próprio beneficiário — CSI, subsídios individuais)
# e data_nascimento_crianca (o beneficiário quando é um dependente do
# requerente — abono, ASE, creche). Cada apoio novo usa o que for
# correcto para si; nunca reintroduzir um "data_nascimento" genérico.
#
# Cada pergunta tem:
#   tipo: categorica | numero | data
#   unidade: obrigatório em "numero", omitido nos outros
#   opcoes: obrigatório em "categorica"
#
# Início mínimo: só os campos que o piloto (CSI, PR 2) precisa. Novos apoios
# acrescentam campos novos aqui só quando o campo ainda não existe — nunca
# duplicam um campo com nome diferente para o mesmo facto.

data_nascimento_requerente:
  descricao: "Data de nascimento da pessoa que faz o pedido, quando é também a própria beneficiária do apoio (ex.: CSI, subsídios individuais)"
  tipo: data

data_nascimento_crianca:
  descricao: "Data de nascimento da criança ou jovem beneficiário do apoio, quando distinto do requerente (ex.: abono de família, ASE, creche)"
  tipo: data

reside_legalmente_pt:
  descricao: "Reside legalmente em Portugal"
  tipo: categorica
  opcoes: [sim, nao]

anos_residencia_pt:
  descricao: "Há quantos anos reside legalmente em Portugal, de forma ininterrupta"
  tipo: numero
  unidade: anos
  aplicavel_se:
    campo: reside_legalmente_pt
    valor: sim

estatuto_residencia:
  descricao: "Estatuto de residência para efeitos de condições de nacionalidade/residência"
  tipo: categorica
  opcoes:
    - nacional_pt
    - cidadao_ue_com_registo
    - titulo_residencia_valido
    - refugiado
  aplicavel_se:
    campo: reside_legalmente_pt
    valor: sim

tem_pensao_invalidez_sem_reavaliacao:
  descricao: "É titular de Pensão de Invalidez do Regime Geral não sujeita a reavaliação médica"
  tipo: categorica
  opcoes: [sim, nao]

em_estudos_ou_formacao_profissional:
  descricao: "A criança/jovem está a estudar ou em formação profissional"
  tipo: categorica
  opcoes: [sim, nao]

tem_deficiencia_ou_incapacidade_reconhecida:
  descricao: "A criança/jovem tem deficiência ou incapacidade reconhecida"
  tipo: categorica
  opcoes: [sim, nao]

rendimento_referencia_anual_agregado:
  descricao: "Rendimento de Referência (RR) anual do agregado familiar — rendimento anual dividido pelo número de crianças/jovens do agregado mais 1, tal como calculado pela Segurança Social"
  tipo: numero
  unidade: "EUR/ano"

situacao_contributiva_regularizada:
  descricao: "A situação contributiva do requerente (ou dos pais/representantes legais) está regularizada perante a Segurança Social e a Autoridade Tributária"
  tipo: categorica
  opcoes: [sim, nao]

patrimonio_mobiliario_agregado:
  descricao: "Valor total do património mobiliário do agregado familiar (depósitos bancários, ações, obrigações, títulos)"
  tipo: numero
  unidade: EUR

tipo_escola_aluno:
  descricao: "Tipo de escola do aluno — pública/protocolo dá acesso à ASE, privada sem protocolo não"
  tipo: categorica
  opcoes: [publica_ou_protocolo, privada_sem_protocolo]

rendimento_per_capita_mensal_agregado:
  descricao: "Rendimento Per Capita (RPC) mensal do agregado — rendimento anual bruto do agregado dividido pelo número de elementos e por 12 meses"
  tipo: numero
  unidade: "EUR/mês"

rendimento_mensal_agregado:
  descricao: "Rendimento mensal total do agregado familiar, já considerado nos termos da condição de recursos (trabalho, pensões, subsídios)"
  tipo: numero
  unidade: "EUR/mês"

numero_adultos_adicionais_agregado:
  descricao: "Número de adultos do agregado além do requerente/titular"
  tipo: numero
  unidade: pessoas

numero_menores_agregado:
  descricao: "Número de menores de 18 anos do agregado"
  tipo: numero
  unidade: pessoas

situacao_profissional:
  descricao: "Situação profissional actual da pessoa requerente"
  tipo: categorica
  opcoes: [empregado, desempregado, estudante, reformado, inativo]

inscrito_centro_emprego_e_disponivel:
  descricao: "Está inscrito/a no Centro de Emprego e disponível para trabalhar, formar ou inserir-se"
  tipo: categorica
  opcoes: [sim, nao]

esta_em_estabelecimento_prisional_ou_institucionalizado:
  descricao: "Está em estabelecimento prisional ou institucionalizado em equipamento financiado pelo Estado"
  tipo: categorica
  opcoes: [sim, nao]

patrimonio_mobiliario_pessoal:
  descricao: "Valor de património mobiliário e bens móveis sujeitos a registo (o mais elevado dos dois, cada um comparado ao limite)"
  tipo: numero
  unidade: EUR

rendimento_mensal_proprio_menor:
  descricao: "Rendimentos próprios mensais do menor requerente (quando o requerente tem menos de 18 anos)"
  tipo: numero
  unidade: "EUR/mês"

esta_gravida:
  descricao: "A pessoa menor requerente está grávida"
  tipo: categorica
  opcoes: [sim, nao]

casado_ou_uniao_facto_mais_de_2_anos:
  descricao: "A pessoa menor requerente é casada ou vive em união de facto há mais de 2 anos"
  tipo: categorica
  opcoes: [sim, nao]

tem_menores_ou_pessoas_deficiencia_a_cargo:
  descricao: "A pessoa menor requerente tem menores ou pessoas com deficiência a cargo"
  tipo: categorica
  opcoes: [sim, nao]

desemprego_involuntario:
  descricao: "A perda de emprego foi involuntária (despedimento colectivo, extinção do posto, caducidade de contrato a prazo, resolução com justa causa pelo trabalhador)"
  tipo: categorica
  opcoes: [sim, nao]

dias_registo_remuneracoes_24_meses:
  descricao: "Dias de registo de remunerações nos 24 meses anteriores à data do desemprego"
  tipo: numero
  unidade: dias
