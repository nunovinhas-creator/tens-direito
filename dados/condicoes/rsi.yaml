# Condições de acesso ao RSI — PR 6 da série "simulador universal". O mais
# complexo até agora: o limiar de rendimento depende da composição do
# agregado (escala de equivalência), não é um número fixo como nos apoios
# anteriores — por isso introduz um novo tipo de condição, `formula`,
# resolvido por scripts/gerar_condicoes_json.py e avaliado por
# avaliarCondicao() em assets/js/calc-apoios.js (PR 6 também).
#
# Fonte das condições: secção "Quem tem direito" de rsi.html.
#
# Simplificações conscientes, fora do âmbito deste PR (documentadas aqui
# para não ficarem escondidas):
# - Património: o art. 9.º do DL 70/2010 fixa o limite "cada um" (mobiliário
#   E bens móveis sujeitos a registo, separadamente) — este schema trata-os
#   como um único campo (patrimonio_mobiliario_pessoal), o mais alto dos
#   dois. Sub-modelar os dois separadamente fica para depois, se for preciso.
# - "Se ficaste desempregado por iniciativa própria sem justa causa: só
#   podes pedir 1 ano depois" — regra temporal não modelada.
# - Institucionalização tem uma excepção temporária e a reclusão permite
#   pedido 45 dias antes da libertação — não modelado, o schema trata as
#   duas como um "não" categórico simples.

apoio: rsi
pagina: rsi.html
titulo: "Rendimento Social de Inserção (RSI)"
simulador: /simulador-rsi.html
tipo_link: simulador
operador: all

# O RSI é absorvido pela PSU (DL 166/2026, art. 63.º: produção de efeitos a
# 31/12/2026; ver psu-lista-13-apoios.html). Até essa data os beneficiários
# mantêm o RSI. Não altera a elegibilidade — o motor só marca o apoio para a
# página poder dizer "a partir de 31/12/2026 este apoio passa a PSU".
substituido_por: psu
substituido_a_partir_de_parametro: psu.data_producao_efeitos

condicoes:
  - id: idade_ou_excepcao_menor
    operador: any
    condicoes:
      - id: idade_normal
        tipo: limiar
        campo: data_nascimento_requerente
        operador_comparacao: gte
        unidade_comparacao: anos
        parametro: rsi.idade_minima_anos

      - id: excepcao_menor
        operador: all
        condicoes:
          - id: rendimentos_proprios_acima_do_limite
            tipo: limiar
            campo: rendimento_mensal_proprio_menor
            operador_comparacao: gte
            # Reutiliza rsi.valor_adulto_adicional_mensal (173,29€) — a
            # página cita-o como "70% do RSI base", o mesmo valor e a
            # mesma fonte (Lei n.º 13/2003, art. 10.º) já usada para o
            # adulto adicional na escala de equivalência. Não é coincidência
            # numérica: é o mesmo parâmetro legal, por isso não se cria um
            # segundo parâmetro para o mesmo número.
            parametro: rsi.valor_adulto_adicional_mensal
          - id: situacao_pessoal
            operador: any
            condicoes:
              - id: gravida
                tipo: categorica
                campo: esta_gravida
                operador_comparacao: eq
                valor_literal: sim
              - id: casada_ou_uniao_2_anos
                tipo: categorica
                campo: casado_ou_uniao_facto_mais_de_2_anos
                operador_comparacao: eq
                valor_literal: sim
              - id: tem_dependentes
                tipo: categorica
                campo: tem_menores_ou_pessoas_deficiencia_a_cargo
                operador_comparacao: eq
                valor_literal: sim

  # PR 11: portão de residência legal — estatuto_residencia e
  # anos_residencia_pt só se perguntam com reside_legalmente_pt == sim
  # (aplicavel_se); sem esta condição, quem responde "não" deixaria o RSI
  # eternamente "indeterminado". O grupo residencia_legal abaixo continua a
  # decidir o estatuto concreto.
  - id: reside_legalmente
    tipo: categorica
    campo: reside_legalmente_pt
    operador_comparacao: eq
    valor_literal: sim

  - id: residencia_legal
    operador: any
    condicoes:
      - id: nacional_pt
        tipo: categorica
        campo: estatuto_residencia
        operador_comparacao: eq
        valor_literal: nacional_pt
      - id: cidadao_ue
        tipo: categorica
        campo: estatuto_residencia
        operador_comparacao: eq
        valor_literal: cidadao_ue_com_registo
      - id: refugiado
        tipo: categorica
        campo: estatuto_residencia
        operador_comparacao: eq
        valor_literal: refugiado
      - id: pais_terceiro_com_1_ano
        operador: all
        condicoes:
          - id: titulo_valido
            tipo: categorica
            campo: estatuto_residencia
            operador_comparacao: eq
            valor_literal: titulo_residencia_valido
          - id: pelo_menos_1_ano
            tipo: limiar
            campo: anos_residencia_pt
            operador_comparacao: gte
            valor_literal: 1
            fonte_pagina: rsi.html

  - id: rendimento_dentro_do_limiar
    tipo: formula
    formula: escala_equivalencia_rsi
    campo_rendimento: rendimento_mensal_agregado
    campo_adultos_adicionais: numero_adultos_adicionais_agregado
    campo_menores: numero_menores_agregado
    parametro_titular: rsi.valor_titular_mensal
    parametro_adulto_adicional: rsi.valor_adulto_adicional_mensal
    parametro_menor: rsi.valor_menor_mensal

  - id: patrimonio_dentro_do_limite
    tipo: limiar
    campo: patrimonio_mobiliario_pessoal
    operador_comparacao: lte
    parametro: rsi.limite_patrimonio_eur

  - id: disponibilidade_se_desempregado
    operador: any
    condicoes:
      - id: nao_desempregado
        tipo: categorica
        campo: situacao_profissional
        operador_comparacao: neq
        valor_literal: desempregado
      - id: inscrito_e_disponivel
        tipo: categorica
        campo: inscrito_centro_emprego_e_disponivel
        operador_comparacao: eq
        valor_literal: sim

  - id: nao_institucionalizado
    tipo: categorica
    campo: esta_em_estabelecimento_prisional_ou_institucionalizado
    operador_comparacao: eq
    valor_literal: nao
