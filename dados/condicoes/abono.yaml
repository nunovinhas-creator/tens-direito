# Condições de acesso ao Abono de Família — PR 4, revisto (correcção de
# 27/09/2026). Fonte das condições: art. 11.º, n.º 2, do Decreto-Lei n.º
# 176/2003 (escada etária) + secção "Quem tem direito" de
# abono-de-familia.html (restantes condições).
#
# Escada etária, agora com quatro degraus + excepção de deficiência,
# todos parametrizados em dados/parametros/abono.yaml (já não há literais
# 16/24 com fonte_pagina):
#   - até 16 anos, sem requisito escolar;
#   - até 18 anos se frequenta ensino básico ou equivalente;
#   - até 21 anos se frequenta ensino secundário ou equivalente;
#   - até 24 anos se frequenta ensino superior ou equivalente;
#   - sem limite de idade com deficiência/incapacidade reconhecida.
#
# Leitura a confirmar: cada degrau é "idade máxima para esse nível" (um
# jovem de 17 anos no secundário cumpre o degrau dos 21), não uma banda
# exclusiva 16–18 / 18–21 / 21–24. É como o art. 11.º n.º 2 é normalmente
# lido, mas a fonte desta versão não foi relida no DRE nesta sessão.
#
# O património mobiliário e o rendimento mantêm-se como no PR 4.

apoio: abono
pagina: abono-de-familia.html
titulo: "Abono de Família"
simulador: /simulador-abono.html
operador: all

condicoes:
  # PR 11: portão do simulador universal — sem ele, quem responde "não
  # tenho filhos" nunca responde às perguntas da criança (aplicavel_se) e o
  # apoio ficaria eternamente "indeterminado". Condição de topo, antes das
  # outras, para excluir cedo.
  - id: tem_filhos_a_cargo
    tipo: categorica
    campo: tem_filhos_a_cargo
    operador_comparacao: eq
    valor_literal: sim

  - id: idade_ou_excepcao
    operador: any
    condicoes:
      - id: ate_16_anos
        tipo: limiar
        campo: data_nascimento_crianca
        operador_comparacao: lte
        unidade_comparacao: anos
        parametro: abono.idade_limite_sem_requisito_escolar

      - id: ensino_basico
        operador: all
        condicoes:
          - id: idade_ate_18
            tipo: limiar
            campo: data_nascimento_crianca
            operador_comparacao: lte
            unidade_comparacao: anos
            parametro: abono.idade_limite_ensino_basico
          - id: frequenta_basico
            tipo: categorica
            campo: nivel_ensino_frequentado
            operador_comparacao: eq
            valor_literal: basico_ou_equivalente

      - id: ensino_secundario
        operador: all
        condicoes:
          - id: idade_ate_21
            tipo: limiar
            campo: data_nascimento_crianca
            operador_comparacao: lte
            unidade_comparacao: anos
            parametro: abono.idade_limite_ensino_secundario
          - id: frequenta_secundario
            tipo: categorica
            campo: nivel_ensino_frequentado
            operador_comparacao: eq
            valor_literal: secundario_ou_equivalente

      - id: ensino_superior
        operador: all
        condicoes:
          - id: idade_ate_24
            tipo: limiar
            campo: data_nascimento_crianca
            operador_comparacao: lte
            unidade_comparacao: anos
            parametro: abono.idade_limite_ensino_superior
          - id: frequenta_superior
            tipo: categorica
            campo: nivel_ensino_frequentado
            operador_comparacao: eq
            valor_literal: superior_ou_equivalente

      - id: sem_limite_por_deficiencia
        tipo: categorica
        campo: tem_deficiencia_ou_incapacidade_reconhecida
        operador_comparacao: eq
        valor_literal: sim

  - id: reside_legalmente
    tipo: categorica
    campo: reside_legalmente_pt
    operador_comparacao: eq
    valor_literal: sim

  - id: rendimento_dentro_do_limite
    tipo: limiar
    campo: rendimento_referencia_anual_agregado
    operador_comparacao: lte
    parametro: abono.escalao4_limite_cenario_pedidos_novos_2026

  - id: situacao_contributiva_ok
    tipo: categorica
    campo: situacao_contributiva_regularizada
    operador_comparacao: eq
    valor_literal: sim

  - id: patrimonio_dentro_do_limite
    tipo: limiar
    campo: patrimonio_mobiliario_agregado
    operador_comparacao: lte
    parametro: abono.patrimonio_mobiliario_limite
