# Condições de acesso ao Subsídio de Doença — PR 8, revisto (correcção de
# 27/09/2026). Base: Decreto-Lei n.º 28/2004, na redacção vigente (art. 9.º
# prazo de garantia; art. 12.º índice de profissionalidade) + Guia Prático
# 5001 do ISS. Fonte desta versão: nota de pesquisa fornecida pelo Nuno em
# 27/09/2026, não relida no DRE nesta sessão. Prazo de garantia e índice
# de profissionalidade estão agora parametrizados em
# dados/parametros/subsidio-doenca.yaml (já não há literais).
#
# Arquitectura da regra por regime:
#   - prazo de garantia (6 meses): todos os abrangidos;
#   - índice de profissionalidade (12 dias): regra geral; NÃO se aplica a
#     trabalhadores independentes nem a marítimos do Seguro Social
#     Voluntário (art. 12.º, n.º 2) — não é "só conta de outrem": o
#     seguro social voluntário não marítimo também o cumpre;
#   - situação contributiva regularizada: condição específica de
#     independentes e beneficiários do Seguro Social Voluntário (todas as
#     variantes) — não se aplica a trabalhadores por conta de outrem.
#
# Exclusões listadas na página, tratadas como condições categóricas
# simples: acumulação de pensão de invalidez relativa com trabalho, e
# indemnização por acidente de trabalho/doença profissional igual ou
# superior ao subsídio.

apoio: subsidio-doenca
pagina: baixa-medica-subsidio-doenca.html
operador: all

condicoes:
  - id: cit_valido
    tipo: categorica
    campo: tem_cit_valido
    operador_comparacao: eq
    valor_literal: sim

  - id: prazo_garantia
    tipo: limiar
    campo: meses_civis_com_registo_remuneracoes
    operador_comparacao: gte
    parametro: subsidio-doenca.prazo_garantia_meses

  - id: indice_profissionalidade
    operador: any
    condicoes:
      - id: isento_independente
        tipo: categorica
        campo: tipo_trabalhador
        operador_comparacao: eq
        valor_literal: independente
      - id: isento_maritimo_ssv
        tipo: categorica
        campo: tipo_trabalhador
        operador_comparacao: eq
        valor_literal: seguro_social_voluntario_maritimo
      - id: cumpre_indice
        tipo: limiar
        campo: dias_registo_remuneracoes_indice_profissionalidade
        operador_comparacao: gte
        parametro: subsidio-doenca.indice_profissionalidade_dias

  - id: situacao_contributiva_independentes_e_ssv
    operador: any
    condicoes:
      - id: e_conta_outrem
        tipo: categorica
        campo: tipo_trabalhador
        operador_comparacao: eq
        valor_literal: conta_outrem
      - id: contributiva_regularizada
        tipo: categorica
        campo: situacao_contributiva_regularizada
        operador_comparacao: eq
        valor_literal: sim

  - id: sem_acumulacao_pensao_invalidez_relativa
    tipo: categorica
    campo: acumula_pensao_invalidez_relativa_com_trabalho
    operador_comparacao: eq
    valor_literal: nao

  - id: sem_indemnizacao_igual_ou_superior
    tipo: categorica
    campo: recebe_indemnizacao_acidente_trabalho_maior_subsidio
    operador_comparacao: eq
    valor_literal: nao
